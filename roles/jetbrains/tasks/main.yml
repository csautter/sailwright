---
- name: Install JetBrains Toolbox on macOS
  homebrew:
    name: jetbrains-toolbox
    state: present
    install_options: cask
  when: ansible_facts['os_family'] == 'Darwin'

- name: Install JetBrains Toolbox on Linux
  when: ansible_facts['os_family'] == 'Debian'
  vars:
    toolbox_directory: /opt/jetbrains-toolbox
  block:
    - name: Read JetBrains Toolbox release metadata
      ansible.builtin.uri:
        url: "https://data.services.jetbrains.com/products/releases?code=TBA&latest=true&type=release"
        return_content: true
      register: toolbox_release
      check_mode: false

    - name: Resolve the Toolbox archive
      ansible.builtin.set_fact:
        toolbox_build: "{{ toolbox_release.json.TBA[0].build }}"
        toolbox_download: "{{ toolbox_release.json.TBA[0].downloads['linuxARM64' if ansible_facts['architecture'] == 'aarch64' else 'linux'] }}"

    # The marker records which build the fixed directory holds, so the role
    # neither depends on the archive's top-level directory name nor keeps one
    # directory per release.
    - name: Check whether the Toolbox release is installed
      ansible.builtin.stat:
        path: "{{ toolbox_directory }}/.sailwright-build-{{ toolbox_build }}"
      register: toolbox_marker

    - name: Install the Toolbox release
      when: not toolbox_marker.stat.exists and not ansible_check_mode
      block:
        - name: Create a private download directory for Toolbox
          ansible.builtin.tempfile:
            state: directory
            suffix: toolbox
          register: toolbox_tmp

        - name: Download and extract the Toolbox release
          block:
            - name: Download JetBrains Toolbox archive
              ansible.builtin.get_url:
                url: "{{ toolbox_download.link }}"
                checksum: "sha256:{{ toolbox_download.checksumLink }}"
                dest: "{{ toolbox_tmp.path }}/{{ toolbox_download.link | basename }}"
                mode: "0644"

            - name: Remove the previous Toolbox release
              ansible.builtin.file:
                path: "{{ toolbox_directory }}"
                state: absent
              become: true

            - name: Create the Toolbox directory
              ansible.builtin.file:
                path: "{{ toolbox_directory }}"
                state: directory
                mode: "0755"
              become: true

            - name: Extract JetBrains Toolbox archive
              ansible.builtin.unarchive:
                src: "{{ toolbox_tmp.path }}/{{ toolbox_download.link | basename }}"
                dest: "{{ toolbox_directory }}"
                remote_src: true
                extra_opts:
                  - --strip-components=1
              become: true

            - name: Record the installed Toolbox build
              ansible.builtin.copy:
                dest: "{{ toolbox_directory }}/.sailwright-build-{{ toolbox_build }}"
                content: "{{ toolbox_build }}\n"
                mode: "0644"
              become: true
          always:
            - name: Remove the Toolbox download directory
              ansible.builtin.file:
                path: "{{ toolbox_tmp.path }}"
                state: absent

    - name: Report pending Toolbox installation in check mode
      ansible.builtin.debug:
        msg: "Would install JetBrains Toolbox {{ toolbox_build }}."
      changed_when: not toolbox_marker.stat.exists
      when: ansible_check_mode

    - name: Find Toolbox releases installed by earlier role versions
      ansible.builtin.find:
        paths: /opt
        patterns: "jetbrains-toolbox-*"
        file_type: directory
      register: toolbox_legacy_directories

    - name: Remove Toolbox releases installed by earlier role versions
      ansible.builtin.file:
        path: "{{ item.path }}"
        state: absent
      loop: "{{ toolbox_legacy_directories.files }}"
      loop_control:
        label: "{{ item.path }}"
      become: true

    - name: Symlink JetBrains Toolbox to /usr/local/bin
      ansible.builtin.file:
        src: "{{ toolbox_directory }}/bin/jetbrains-toolbox"
        dest: /usr/local/bin/jetbrains-toolbox
        state: link
        force: true
      become: true

- name: Install JetBrains Toolbox on Windows (via Chocolatey)
  win_chocolatey:
    name: jetbrainstoolbox
    state: present
  when: ansible_facts['os_family'] == 'Windows'
