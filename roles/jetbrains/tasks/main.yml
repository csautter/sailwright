---
- name: Install JetBrains Toolbox on macOS
  homebrew:
    name: jetbrains-toolbox
    state: present
    install_options: cask
  when: ansible_facts['os_family'] == 'Darwin'

- name: Install JetBrains Toolbox on Linux
  when: ansible_facts['os_family'] == 'Debian'
  block:
    - name: Read JetBrains Toolbox release metadata
      ansible.builtin.uri:
        url: "https://data.services.jetbrains.com/products/releases?code=TBA&latest=true&type=release"
        return_content: true
      register: toolbox_release
      check_mode: false

    - name: Resolve the Toolbox archive
      ansible.builtin.set_fact:
        toolbox_download: "{{ toolbox_release.json.TBA[0].downloads['linuxARM64' if ansible_facts['architecture'] == 'aarch64' else 'linux'] }}"

    - name: Resolve the extracted Toolbox directory
      ansible.builtin.set_fact:
        toolbox_directory: "/opt/{{ toolbox_download.link | basename | regex_replace('[.]tar[.]gz$', '') }}"

    - name: Check whether the Toolbox release is extracted
      ansible.builtin.stat:
        path: "{{ toolbox_directory }}/bin/jetbrains-toolbox"
      register: toolbox_binary

    - name: Download JetBrains Toolbox archive
      ansible.builtin.get_url:
        url: "{{ toolbox_download.link }}"
        checksum: "sha256:{{ toolbox_download.checksumLink }}"
        dest: "/tmp/{{ toolbox_download.link | basename }}"
        mode: "0644"
      when: not toolbox_binary.stat.exists and not ansible_check_mode

    - name: Extract JetBrains Toolbox archive
      ansible.builtin.unarchive:
        src: "/tmp/{{ toolbox_download.link | basename }}"
        dest: /opt
        remote_src: true
        creates: "{{ toolbox_directory }}/bin/jetbrains-toolbox"
      become: true
      when: not toolbox_binary.stat.exists and not ansible_check_mode

    - name: Report pending Toolbox extraction in check mode
      ansible.builtin.debug:
        msg: "Would install {{ toolbox_download.link }}."
      changed_when: not toolbox_binary.stat.exists
      when: ansible_check_mode

    - name: Symlink JetBrains Toolbox to /usr/local/bin
      ansible.builtin.file:
        src: "{{ toolbox_directory }}/bin/jetbrains-toolbox"
        dest: /usr/local/bin/jetbrains-toolbox
        state: link
        force: true
      become: true

- name: Install JetBrains Toolbox on Windows (via Chocolatey)
  win_chocolatey:
    name: jetbrainstoolbox
    state: present
  when: ansible_facts['os_family'] == 'Windows'
