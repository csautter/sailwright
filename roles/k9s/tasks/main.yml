- name: Install k9s on macOS using Homebrew
  community.general.homebrew:
    name: k9s
    state: present
  when: ansible_facts['os_family'] == "Darwin"

- name: Install k9s on Linux
  when: ansible_facts['system'] == 'Linux'
  block:
    - name: Check installed k9s version
      ansible.builtin.command: /usr/local/bin/k9s version --short
      register: k9s_installed
      changed_when: false
      failed_when: false
      check_mode: false

    - name: Ensure k9s supports the Linux architecture
      ansible.builtin.assert:
        that: ansible_facts['architecture'] in ['x86_64', 'aarch64', 'arm64']
        fail_msg: "Unsupported architecture for k9s: {{ ansible_facts['architecture'] }}"
        quiet: true

    - name: Resolve k9s Linux architecture and installed version
      ansible.builtin.set_fact:
        k9s_arch: "{{ {'x86_64': 'amd64', 'aarch64': 'arm64', 'arm64': 'arm64'}[ansible_facts['architecture']] }}"
        k9s_installed_version: "{{ k9s_installed.stdout | default('') | regex_search('(?<![0-9.])v?([0-9]+[.][0-9]+[.][0-9]+)(?![0-9.])', '\\1') | default([''], true) | first }}"

    - name: Install the pinned k9s release
      when:
        - not ansible_check_mode
        - k9s_installed_version != k9s_version
      block:
        - name: Create a private download directory for k9s
          ansible.builtin.tempfile:
            state: directory
            suffix: k9s
          register: k9s_tmp

        - name: Download and extract the verified k9s release
          block:
            - name: Download k9s archive with its release checksum
              ansible.builtin.get_url:
                url: "https://github.com/derailed/k9s/releases/download/v{{ k9s_version }}/k9s_Linux_{{ k9s_arch }}.tar.gz"
                checksum: "sha256:https://github.com/derailed/k9s/releases/download/v{{ k9s_version }}/checksums.sha256"
                dest: "{{ k9s_tmp.path }}/k9s_Linux_{{ k9s_arch }}.tar.gz"
                mode: '0644'

            - name: Extract the verified k9s binary
              ansible.builtin.unarchive:
                src: "{{ k9s_tmp.path }}/k9s_Linux_{{ k9s_arch }}.tar.gz"
                dest: /usr/local/bin
                remote_src: true
                include:
                  - k9s
                mode: '0755'
              become: true
          always:
            - name: Remove the k9s download directory
              ansible.builtin.file:
                path: "{{ k9s_tmp.path }}"
                state: absent

    - name: Report pending k9s installation in check mode
      ansible.builtin.debug:
        msg: "Would install k9s {{ k9s_version }} for {{ k9s_arch }}."
      changed_when: k9s_installed_version != k9s_version
      when: ansible_check_mode

# WINDOWS SECTION

- name: Check if Chocolatey is available
  win_command: choco --version
  register: choco_check
  ignore_errors: true
  changed_when: false
  when: ansible_facts['os_family'] == "Windows"

- name: Install k9s using Chocolatey
  win_chocolatey:
    name: k9s
    state: present
  when: ansible_facts['os_family'] == "Windows" and (choco_check.rc | default(1)) == 0

- name: Set k9s arch for Windows fallback
  set_fact:
    k9s_arch: "{{ 'arm64' if ansible_facts['architecture'] == 'arm64' else 'x86_64' }}"
  when: ansible_facts['os_family'] == "Windows" and (choco_check.rc | default(1)) != 0

- name: Create fallback install folder
  win_file:
    path: 'C:\Program Files\k9s'
    state: directory
  when: ansible_facts['os_family'] == "Windows" and (choco_check.rc | default(1)) != 0 and not ansible_check_mode

- name: Download k9s binary (Windows fallback)
  win_get_url:
    url: "https://github.com/derailed/k9s/releases/download/v{{ k9s_version }}/k9s_Windows_{{ k9s_arch }}.tar.gz"
    dest: "C:\\Program Files\\k9s\\k9s.tar.gz"
  when: ansible_facts['os_family'] == "Windows" and (choco_check.rc | default(1)) != 0 and not ansible_check_mode

- name: Extract k9s binary (Windows fallback)
  win_unzip:
    src: "C:\\Program Files\\k9s\\k9s.tar.gz"
    dest: "C:\\Program Files\\k9s"
    remote_src: yes
  when: ansible_facts['os_family'] == "Windows" and (choco_check.rc | default(1)) != 0 and not ansible_check_mode

- name: Add fallback k9s path to PATH
  win_path:
    elements:
      - "C:\\Program Files\\k9s"
  when: ansible_facts['os_family'] == "Windows" and (choco_check.rc | default(1)) != 0 and not ansible_check_mode
