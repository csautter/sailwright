---
# Homebrew's unversioned temurin cask follows the current JDK, not JDK 24.
- name: Check whether Temurin 24 is installed
  ansible.builtin.stat:
    path: /Library/Java/JavaVirtualMachines/temurin-24.jdk/Contents/Home/bin/java
  register: temurin24_binary

- name: Install the archived Temurin 24 package
  when: not temurin24_binary.stat.exists and not ansible_check_mode
  block:
    - name: Read the final Temurin 24 release metadata
      ansible.builtin.uri:
        url: https://api.github.com/repos/adoptium/temurin24-binaries/releases/latest
        return_content: true
      register: temurin24_release

    - name: Select the Temurin 24 macOS package
      ansible.builtin.set_fact:
        temurin24_package: >-
          {{ temurin24_release.json.assets
             | selectattr('name', 'match', 'OpenJDK24U-jdk_' ~
                 ('aarch64' if ansible_facts['architecture'] == 'arm64' else 'x64') ~
                 '_mac_hotspot_.*[.]pkg$') | first }}

    - name: Download the Temurin 24 package
      ansible.builtin.get_url:
        url: "{{ temurin24_package.browser_download_url }}"
        dest: "/tmp/{{ temurin24_package.name }}"
        mode: '0644'

    - name: Install the Temurin 24 package
      ansible.builtin.command:
        argv:
          - /usr/sbin/installer
          - -pkg
          - "/tmp/{{ temurin24_package.name }}"
          - -target
          - /
        creates: /Library/Java/JavaVirtualMachines/temurin-24.jdk/Contents/Home/bin/java
      become: true

- name: Report pending Temurin 24 installation in check mode
  ansible.builtin.debug:
    msg: Would install the archived Temurin 24 macOS package.
  changed_when: not temurin24_binary.stat.exists
  when: ansible_check_mode
