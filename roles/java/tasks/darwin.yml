- name: Check if Rosetta 2 is installed
  stat:
    path: /usr/libexec/rosetta
  register: rosetta_stat

- set_fact:
    rosetta_installed: "{{ rosetta_stat.stat.exists }}"

- name: Install Rosetta 2 if JDK 8 is required and Rosetta is not installed
  become: true
  command: /usr/sbin/softwareupdate --install-rosetta --agree-to-license
  when:
    - 8 in jdk_versions
    - ansible_facts['architecture'] == 'arm64'
    - rosetta_installed is not defined or not rosetta_installed

- name: Install Homebrew Temurin casks
  community.general.homebrew_cask:
    name: "{{ 'temurin@' ~ item }}"
    state: present
  loop: "{{ jdk_versions }}"
  when: item != 24

- name: Install archived Temurin 24 on macOS
  ansible.builtin.include_tasks: darwin_temurin24.yml
  when: 24 in jdk_versions

- name: Install jenv with Homebrew
  community.general.homebrew:
    name: jenv
    state: present

- name: Check if .zshrc exists
  stat:
    path: "{{ ansible_env.HOME }}/.zshrc"
  register: zshrc_stat

- name: Add jenv init to shell config
  lineinfile:
    path: "{{ ansible_env.HOME }}/.zshrc"
    line: 'eval "$(jenv init -)"'
    insertafter: EOF
    create: yes

- name: Discover Java home paths
  command: /usr/libexec/java_home -F -v {{ '1.8' if item == 8 else item }}
  loop: "{{ jdk_versions }}"
  register: java_home_paths
  changed_when: false
  failed_when: not ansible_check_mode and java_home_paths.rc != 0
  check_mode: false

- name: Add Java versions to jenv
  shell: |
    export PATH="/opt/homebrew/bin:/usr/local/bin:$PATH"
    jenv add "{{ item.stdout }}"
  loop: "{{ java_home_paths.results | selectattr('rc', 'equalto', 0) | list }}"
  register: jenv_add
  changed_when: "' added' in jenv_add.stdout"

- name: Create .zshrc if it does not exist
  file:
    path: "{{ ansible_env.HOME }}/.zshrc"
    state: touch
    mode: "0644"
  when: not zshrc_stat.stat.exists

- name: Set global Java version via jenv
  lineinfile:
    path: "{{ ansible_env.HOME }}/.zshrc"
    line: "jenv global {{ jdk_default_version }}"
    insertafter: EOF
    create: true

- name: Ensure jenv plugins directory exists
  file:
    path: "{{ ansible_env.HOME }}/.jenv/plugins"
    state: directory
    mode: "0755"

- name: Enable jenv plugin maven
  shell: |
    export PATH="/opt/homebrew/bin:/usr/local/bin:$PATH"
    eval "$(jenv init -)"
    jenv enable-plugin maven
  args:
    executable: /bin/zsh
    creates: "{{ ansible_env.HOME }}/.jenv/plugins/maven"
