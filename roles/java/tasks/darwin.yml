- name: Check if Rosetta 2 is installed
  stat:
    path: /usr/libexec/rosetta
  register: rosetta_stat

- set_fact:
    rosetta_installed: "{{ rosetta_stat.stat.exists }}"

- name: Install Rosetta 2 if JDK 8 is required and Rosetta is not installed
  become: true
  command: /usr/sbin/softwareupdate --install-rosetta --agree-to-license
  when:
    - 8 in jdk_versions
    - ansible_facts['architecture'] == 'arm64'
    - rosetta_installed is not defined or not rosetta_installed

# Temurin JDKs come from Adoptium .pkg installers instead of Homebrew casks:
# casks run their own sudo, which neither --ask-become-pass nor a become
# password file reaches. Existing cask installs use the same JDK paths.
- name: Check installed Temurin JDKs
  ansible.builtin.stat:
    path: "/Library/Java/JavaVirtualMachines/temurin-{{ item }}.jdk/Contents/Home/bin/java"
  loop: "{{ jdk_versions }}"
  register: temurin_binaries

- name: Collect missing Temurin JDKs
  ansible.builtin.set_fact:
    temurin_missing: "{{ temurin_binaries.results | rejectattr('stat.exists') | map(attribute='item') | list }}"

- name: Install missing Temurin JDKs
  ansible.builtin.include_tasks: darwin_temurin.yml
  loop: "{{ temurin_missing }}"
  loop_control:
    loop_var: temurin_version
  when: not ansible_check_mode

- name: Report pending Temurin installations in check mode
  ansible.builtin.debug:
    msg: "Would install Temurin {{ temurin_missing | join(', ') }}."
  changed_when: true
  when: ansible_check_mode and temurin_missing | length > 0

- name: Install jenv with Homebrew
  community.general.homebrew:
    name: jenv
    state: present

- name: Check if .zshrc exists
  stat:
    path: "{{ ansible_env.HOME }}/.zshrc"
  register: zshrc_stat

- name: Add jenv init to shell config
  lineinfile:
    path: "{{ ansible_env.HOME }}/.zshrc"
    line: 'eval "$(jenv init -)"'
    insertafter: EOF
    create: yes

- name: Discover Java home paths
  command: /usr/libexec/java_home -F -v {{ '1.8' if item == 8 else item }}
  loop: "{{ jdk_versions }}"
  register: java_home_paths
  changed_when: false
  failed_when: not ansible_check_mode and java_home_paths.rc != 0
  check_mode: false

- name: Add Java versions to jenv
  shell: |
    export PATH="/opt/homebrew/bin:/usr/local/bin:$PATH"
    jenv add "{{ item.stdout }}"
  loop: "{{ java_home_paths.results | selectattr('rc', 'equalto', 0) | list }}"
  register: jenv_add
  changed_when: "' added' in jenv_add.stdout"

- name: Create .zshrc if it does not exist
  file:
    path: "{{ ansible_env.HOME }}/.zshrc"
    state: touch
    mode: "0644"
  when: not zshrc_stat.stat.exists

- name: Set global Java version via jenv
  lineinfile:
    path: "{{ ansible_env.HOME }}/.zshrc"
    line: "jenv global {{ jdk_default_version }}"
    insertafter: EOF
    create: true

- name: Ensure jenv plugins directory exists
  file:
    path: "{{ ansible_env.HOME }}/.jenv/plugins"
    state: directory
    mode: "0755"

- name: Enable jenv plugin maven
  shell: |
    export PATH="/opt/homebrew/bin:/usr/local/bin:$PATH"
    eval "$(jenv init -)"
    jenv enable-plugin maven
  args:
    executable: /bin/zsh
    creates: "{{ ansible_env.HOME }}/.jenv/plugins/maven"
