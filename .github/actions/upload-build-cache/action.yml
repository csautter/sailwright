name: 'Upload Build Cache Files'
description: >
  For each file in the supplied list, saves it to the local runner shared-volume
  cache (macOS Tart VirtioFS) when applicable, and uploads it to the selected
  remote cache backend when no object already exists. Works on Windows, macOS,
  and Linux.

inputs:
  storage-backend:
    description: >
      Remote cache backend. Use "ftp" for explicit FTPS, or "azure" for the
      legacy Azure Blob Storage backend.
    required: false
    default: 'ftp'
  files:
    description: |
      JSON array of cache file descriptors. Each object may contain:
        - local-path  (required) path to the file in the workspace
        - blob-name   (optional) object key; defaults to basename of local-path
        - container   (optional) legacy Azure container name; ignored by FTP; defaults to "build-cache"
        - overwrite   (optional) whether to replace an existing cached file/blob; defaults to false
        - manifest    (optional) FTP key of a pointer JSON; such entries are managed by the
                      "Refresh Windows 11 ISO" workflow and are skipped here
      Pass '[]' to skip all cache operations (e.g. for builds with no cached files).
    required: true
  subscription-id:
    description: 'Azure subscription ID used to derive the storage account name when storage-backend is "azure"'
    required: false
    default: ''
  ftp-server:
    description: 'FTP server hostname. Explicit TLS is enforced by the scripts.'
    required: false
    default: ''
  ftp-port:
    description: 'FTP server port. Leave empty to use the default FTP port.'
    required: false
    default: ''
  ftp-username:
    description: 'FTP username'
    required: false
    default: ''
  ftp-password:
    description: 'FTP password'
    required: false
    default: ''
  ftp-base-dir:
    description: 'Base directory on the FTP server. Defaults to "/private".'
    required: false
    default: ''
  local-cache-dir:
    description: >
      Path to the local runner shared-volume cache directory (macOS Tart VirtioFS).
      Leave empty to disable local cache write-back.
    required: false
    default: '/Volumes/My Shared Files/build-cache'

runs:
  using: "composite"
  steps:
    - name: Upload build cache files (Linux/macOS)
      if: runner.os != 'Windows'
      shell: bash
      env:
        CACHE_FILES: ${{ inputs.files }}
        CACHE_BACKEND: ${{ inputs.storage-backend }}
        SUBSCRIPTION_ID: ${{ inputs.subscription-id }}
        FTP_SERVER: ${{ inputs.ftp-server || env.BUILD_CACHE_FTP_SERVER || env.FTP_SERVER }}
        FTP_PORT: ${{ inputs.ftp-port || env.BUILD_CACHE_FTP_PORT || env.FTP_PORT }}
        FTP_USERNAME: ${{ inputs.ftp-username || env.BUILD_CACHE_FTP_USERNAME || env.FTP_USERNAME }}
        FTP_PASSWORD: ${{ inputs.ftp-password || env.BUILD_CACHE_FTP_PASSWORD || env.FTP_PASSWORD }}
        FTP_BASE_DIR: ${{ inputs.ftp-base-dir || env.BUILD_CACHE_FTP_BASE_DIR || env.FTP_BASE_DIR || '/private' }}
        LOCAL_CACHE_DIR: ${{ inputs.local-cache-dir }}
      run: bash "${{ github.action_path }}/scripts/upload-build-cache.sh"

    - name: Upload build cache files (Windows)
      if: runner.os == 'Windows'
      shell: powershell
      env:
        CACHE_FILES: ${{ inputs.files }}
        CACHE_BACKEND: ${{ inputs.storage-backend }}
        SUBSCRIPTION_ID: ${{ inputs.subscription-id }}
        FTP_SERVER: ${{ inputs.ftp-server || env.BUILD_CACHE_FTP_SERVER || env.FTP_SERVER }}
        FTP_PORT: ${{ inputs.ftp-port || env.BUILD_CACHE_FTP_PORT || env.FTP_PORT }}
        FTP_USERNAME: ${{ inputs.ftp-username || env.BUILD_CACHE_FTP_USERNAME || env.FTP_USERNAME }}
        FTP_PASSWORD: ${{ inputs.ftp-password || env.BUILD_CACHE_FTP_PASSWORD || env.FTP_PASSWORD }}
        FTP_BASE_DIR: ${{ inputs.ftp-base-dir || env.BUILD_CACHE_FTP_BASE_DIR || env.FTP_BASE_DIR || '/private' }}
        LOCAL_CACHE_DIR: ${{ inputs.local-cache-dir }}
      run: |
        & "${{ github.action_path }}\scripts\upload-build-cache.ps1"
