name: Release Binaries

on:
  workflow_call:
    inputs:
      version:
        required: true
        type: string
    secrets:
      HOMEBREW_TAP_TOKEN:
        required: false
  pull_request:
  # Run from main only: install.sh and install.ps1 verify the checksums
  # signature against release-binaries.yml@refs/heads/main.
  workflow_dispatch:
    inputs:
      version:
        description: Version tag to publish, for example v1.2.3
        required: true
        type: string

concurrency:
  group: ${{ github.workflow }}-${{ inputs.version || github.event.pull_request.head.sha || github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.goos }}-${{ matrix.goarch }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: darwin
            goarch: amd64
          - goos: darwin
            goarch: arm64
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
          - goos: windows
            goarch: amd64
          - goos: windows
            goarch: arm64
    env:
      VERSION: ${{ inputs.version || format('pr-{0}', github.event.pull_request.number) }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Package release artifact
        run: make package-cli-target package-gateway-target GOOS=${{ matrix.goos }} GOARCH=${{ matrix.goarch }} VERSION=${VERSION}

      - name: Upload packaged artifact
        uses: actions/upload-artifact@v7
        with:
          name: release-${{ matrix.goos }}-${{ matrix.goarch }}
          path: |
            dist/sailwright_*_${{ matrix.goos }}_${{ matrix.goarch }}.tar.gz
            dist/sailwright_*_${{ matrix.goos }}_${{ matrix.goarch }}.zip
            dist/sailwright-gateway_*_${{ matrix.goos }}_${{ matrix.goarch }}.tar.gz
            dist/sailwright-gateway_*_${{ matrix.goos }}_${{ matrix.goarch }}.zip
          if-no-files-found: error

  publish:
    name: Publish release assets
    runs-on: ubuntu-latest
    if: ${{ github.event_name != 'pull_request' }}
    needs:
      - build
    permissions:
      contents: write
      id-token: write
    env:
      VERSION: ${{ inputs.version }}

    steps:
      - name: Require main
        if: ${{ github.ref != 'refs/heads/main' }}
        run: |
          echo "::error::Publish from main only; the install scripts reject signatures from ${GITHUB_REF}."
          exit 1

      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Download packaged artifacts
        uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      # Published on every release so that
      # https://github.com/csautter/sailwright/releases/latest/download/install.{sh,ps1}
      # stays a stable URL.
      - name: Add install scripts
        run: cp scripts/install.sh scripts/install.ps1 dist/

      - name: Generate checksums
        run: |
          checksum_file="dist/sailwright_${VERSION#v}_checksums.txt"
          sha256sum dist/* > "${checksum_file}"

      - name: Install cosign
        uses: sigstore/cosign-installer@v3

      - name: Sign checksums (keyless)
        run: |
          checksum_file="dist/sailwright_${VERSION#v}_checksums.txt"
          cosign sign-blob --yes \
            --output-signature "${checksum_file}.sig" \
            --output-certificate "${checksum_file}.pem" \
            "${checksum_file}"

      - name: Upload release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload --repo "${GITHUB_REPOSITORY}" "${VERSION}" dist/* --clobber

  install-script-verify:
    name: Verify install script (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    if: ${{ github.event_name != 'pull_request' }}
    needs:
      - publish
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest
    env:
      VERSION: ${{ inputs.version }}

    steps:
      - name: Install cosign
        uses: sigstore/cosign-installer@v3

      - name: Install with the published install.sh
        if: ${{ runner.os != 'Windows' }}
        run: |
          curl -fsSL "https://github.com/${GITHUB_REPOSITORY}/releases/download/${VERSION}/install.sh" |
            sh -s -- --version "${VERSION}" --install-dir "${RUNNER_TEMP}/bin" | tee install.log
          grep -q "Verifying the checksums signature with cosign" install.log
          "${RUNNER_TEMP}/bin/sailwright" --help | grep -q "Usage:"
          "${RUNNER_TEMP}/bin/sailwright-gateway" --help | grep -q "Usage:"

      - name: Install with the published install.ps1
        if: ${{ runner.os == 'Windows' }}
        shell: pwsh
        run: |
          $env:SAILWRIGHT_VERSION = $env:VERSION
          $env:SAILWRIGHT_INSTALL_DIR = Join-Path $env:RUNNER_TEMP 'bin'
          irm "https://github.com/$env:GITHUB_REPOSITORY/releases/download/$env:VERSION/install.ps1" | iex
          if (-not ((& sailwright --help) -match 'Usage:')) { throw 'sailwright --help failed' }
          if (-not ((& sailwright-gateway --help) -match 'Usage:')) { throw 'sailwright-gateway --help failed' }

  # Install this PR's archives with the install scripts, so a change to the
  # archive names or layout fails here instead of after a release.
  install-script-check:
    name: Check install script (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    if: ${{ github.event_name == 'pull_request' }}
    needs:
      - build
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: linux-amd64
          - os: macos-latest
            target: darwin-arm64
          - os: windows-latest
            target: windows-amd64
    env:
      PR_NUMBER: ${{ github.event.pull_request.number }}
      VERSION: 0.0.0-pr.${{ github.event.pull_request.number }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Download packaged artifacts
        uses: actions/download-artifact@v8
        with:
          name: release-${{ matrix.target }}
          path: dist

      # Lay the archives out like a release with a checksums file. There is
      # no signature, and the runners have no cosign, so the scripts skip it.
      - name: Stage a local release
        shell: bash
        run: |
          serve_dir="serve/v${VERSION}"
          mkdir -p "${serve_dir}"
          for asset in dist/*_pr-"${PR_NUMBER}"_*; do
            name="$(basename "${asset}")"
            mv "${asset}" "${serve_dir}/${name/_pr-${PR_NUMBER}_/_${VERSION}_}"
          done
          cd "${serve_dir}"
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum -- * > "sailwright_${VERSION}_checksums.txt"
          else
            shasum -a 256 -- * > "sailwright_${VERSION}_checksums.txt"
          fi
          cat "sailwright_${VERSION}_checksums.txt"

      - name: Install with install.sh
        if: ${{ runner.os != 'Windows' }}
        run: |
          python3 -m http.server 8765 --directory serve >/dev/null 2>&1 &
          server=$!
          trap 'kill "${server}"' EXIT
          for _ in $(seq 30); do
            curl -fsS -o /dev/null http://127.0.0.1:8765/ && break
            sleep 0.5
          done
          SAILWRIGHT_DOWNLOAD_URL=http://127.0.0.1:8765 sh scripts/install.sh \
            --version "v${VERSION}" --install-dir "${RUNNER_TEMP}/bin"
          "${RUNNER_TEMP}/bin/sailwright" --help | grep -q "Usage:"
          "${RUNNER_TEMP}/bin/sailwright-gateway" --help | grep -q "Usage:"

      - name: Install with install.ps1
        if: ${{ runner.os == 'Windows' }}
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $server = Start-Process python -ArgumentList '-m', 'http.server', '8765', '--directory', (Resolve-Path serve) -PassThru -WindowStyle Hidden
          try {
            foreach ($attempt in 1..30) {
              try {
                Invoke-WebRequest -UseBasicParsing -Uri 'http://127.0.0.1:8765/' | Out-Null
                break
              } catch {
                Start-Sleep -Milliseconds 500
              }
            }
            $env:SAILWRIGHT_DOWNLOAD_URL = 'http://127.0.0.1:8765'
            $env:SAILWRIGHT_VERSION = "v$env:VERSION"
            $installDir = Join-Path $env:RUNNER_TEMP 'bin'
            $env:SAILWRIGHT_INSTALL_DIR = $installDir
            Get-Content -Raw scripts/install.ps1 | Invoke-Expression
            if (-not ((& (Join-Path $installDir 'sailwright.exe') --help) -match 'Usage:')) { throw 'sailwright --help failed' }
            if (-not ((& (Join-Path $installDir 'sailwright-gateway.exe') --help) -match 'Usage:')) { throw 'sailwright-gateway --help failed' }
          } finally {
            Stop-Process -Id $server.Id -Force -ErrorAction SilentlyContinue
          }

  homebrew-formula-check:
    name: Check Homebrew formulae
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'pull_request' }}
    needs:
      - build
    permissions:
      contents: read
    env:
      PR_NUMBER: ${{ github.event.pull_request.number }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Download packaged artifacts
        uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: Test formula renderer
        run: scripts/homebrew/render-formula_test.sh

      - name: Render and syntax-check formulae
        run: |
          # PR builds are packaged as pr-<number>; rename them to a semver
          # version so they render like a real release.
          VERSION="0.0.0-pr.${PR_NUMBER}"
          for asset in dist/*_pr-"${PR_NUMBER}"_*; do
            mv "${asset}" "${asset/_pr-${PR_NUMBER}_/_${VERSION}_}"
          done
          sha256sum dist/* > checksums.txt
          for formula in sailwright sailwright-gateway; do
            scripts/homebrew/render-formula.sh "${formula}" "${VERSION}" checksums.txt > "${formula}.rb"
            ruby -c "${formula}.rb"
          done

      - name: Lint formulae with Homebrew
        run: |
          eval "$(/home/linuxbrew/.linuxbrew/bin/brew shellenv)"
          brew tap-new --no-git local/check
          tap_dir="$(brew --repository local/check)"
          cp sailwright.rb sailwright-gateway.rb "${tap_dir}/Formula/"
          brew style local/check/sailwright local/check/sailwright-gateway
          brew audit --strict local/check/sailwright local/check/sailwright-gateway

  homebrew-tap:
    name: Update Homebrew tap
    runs-on: ubuntu-latest
    if: ${{ github.event_name != 'pull_request' }}
    needs:
      - publish
    permissions:
      contents: read
    outputs:
      updated: ${{ steps.token.outputs.present }}
    env:
      VERSION: ${{ inputs.version }}
      HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}

    steps:
      - name: Check tap token
        id: token
        run: |
          if [ -z "${HOMEBREW_TAP_TOKEN}" ]; then
            echo "::warning::HOMEBREW_TAP_TOKEN is not set; skipping the Homebrew tap update."
            echo "present=false" >> "${GITHUB_OUTPUT}"
          else
            echo "present=true" >> "${GITHUB_OUTPUT}"
          fi

      - name: Checkout
        if: ${{ steps.token.outputs.present == 'true' }}
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Checkout tap
        if: ${{ steps.token.outputs.present == 'true' }}
        uses: actions/checkout@v7
        with:
          repository: csautter/homebrew-sailwright
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          path: homebrew-tap

      - name: Guard against pre-releases and downgrades
        id: guard
        if: ${{ steps.token.outputs.present == 'true' }}
        run: |
          new="${VERSION#v}"
          if [[ "${new}" == *-* ]]; then
            echo "::error::${VERSION} is a pre-release; refusing to publish it to the tap."
            exit 1
          fi
          current=""
          if [ -f homebrew-tap/Formula/sailwright.rb ]; then
            current="$(sed -n 's|.*/releases/download/v\([^/]*\)/.*|\1|p' homebrew-tap/Formula/sailwright.rb | head -n1)"
          fi
          if [ -n "${current}" ] && [ "${new}" != "${current}" ] \
            && [ "$(printf '%s\n%s\n' "${current}" "${new}" | sort -V | tail -n1)" = "${current}" ]; then
            echo "::error::Tap already has ${current}; refusing to downgrade to ${new}."
            exit 1
          fi

      - name: Download release checksums
        if: ${{ steps.token.outputs.present == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release download "${VERSION}" --repo "${GITHUB_REPOSITORY}" --pattern "sailwright_${VERSION#v}_checksums.txt" --output checksums.txt

      - name: Render formulae
        if: ${{ steps.token.outputs.present == 'true' }}
        run: |
          mkdir -p homebrew-tap/Formula
          for formula in sailwright sailwright-gateway; do
            scripts/homebrew/render-formula.sh "${formula}" "${VERSION}" checksums.txt > "homebrew-tap/Formula/${formula}.rb"
            ruby -c "homebrew-tap/Formula/${formula}.rb"
          done

      - name: Push formulae
        if: ${{ steps.token.outputs.present == 'true' }}
        working-directory: homebrew-tap
        run: |
          git add Formula
          if git diff --cached --quiet; then
            echo "Formulae already up to date."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "sailwright ${VERSION}"
          git pull --rebase origin HEAD
          git push
          {
            echo "### Homebrew tap"
            echo "Published sailwright ${VERSION} to csautter/homebrew-sailwright."
          } >> "${GITHUB_STEP_SUMMARY}"

  homebrew-verify:
    name: Verify Homebrew install (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    if: ${{ needs.homebrew-tap.outputs.updated == 'true' }}
    needs:
      - homebrew-tap
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os:
          - macos-latest
          - ubuntu-latest

    steps:
      - name: Install and test from the tap
        run: |
          if [ "${RUNNER_OS}" = "Linux" ]; then
            eval "$(/home/linuxbrew/.linuxbrew/bin/brew shellenv)"
          fi
          brew install csautter/sailwright/sailwright csautter/sailwright/sailwright-gateway
          brew test csautter/sailwright/sailwright csautter/sailwright/sailwright-gateway
