name: Test Packer Build on macOS for VMs

permissions:
  contents: read

on:
  workflow_dispatch:
    inputs:
      enable_utm_qemu_macos:
        description: 'Enable UTM QEMU macOS builds'
        required: false
        default: true
        type: boolean
  pull_request:
    paths:
      - "cmd/main.go"
      - "cmd/cmd/**"
      - "build/packer/linux/*"
      - "build/packer/linux/**/*"
      - "build/packer/windows/*"
      - "build/packer/windows/**/*"
      - "pkg/build/**"
      - "pkg/deploy/**"
      - "scripts/linux/*"
      - "scripts/linux/**/*"
      - "scripts/macos/*"
      - "scripts/macos/**/*"
      - "scripts/windows/*"
      - "scripts/windows/**/*"
      - ".github/workflows/test-build-macos.yml"
      - ".github/actions/download-build-cache/**"
      - ".github/actions/upload-build-cache/**"

jobs:
  test-packer-build:
    if: github.event_name == 'pull_request' || inputs.enable_utm_qemu_macos
    name: build ${{ matrix.go_test_name }} VM_OS ${{ matrix.vm_os }} runner_os ${{ vars.USE_TART_MACOS_RUNNERS == 'true' && matrix.tart_runs_on || matrix.runs_on }}
    runs-on: ${{ vars.USE_TART_MACOS_RUNNERS == 'true' && matrix.tart_runs_on || matrix.runs_on }}
    env:
      DEV_ALCHEMY_APP_DATA_DIR: ${{ github.workspace }}/.dev-alchemy
      DEV_ALCHEMY_CACHE_DIR: ${{ github.workspace }}/.dev-alchemy/cache
      DEV_ALCHEMY_VAGRANT_DIR: ${{ github.workspace }}/.dev-alchemy/.vagrant
      DEV_ALCHEMY_PACKER_CACHE_DIR: ${{ github.workspace }}/.dev-alchemy/packer_cache
      PACKER_CACHE_DIR: ${{ github.workspace }}/.dev-alchemy/packer_cache
      USE_TART_MACOS_RUNNERS: ${{ vars.USE_TART_MACOS_RUNNERS == 'true' && 'true' || 'false' }}
    timeout-minutes: 260
    strategy:
      fail-fast: false
      matrix:
        include:
          - vm_os: windows11
            go_test_name: TestBuildQemuWindows11Arm64OnMacos
            deploy_test_name: TestDeployUtmWindows11Arm64OnMacos
            runs_on: macos-26
            tart_runs_on: macos-26-tart
            packer_start_only: "false"
            packer_start_timeout: "180"
            cache_files: >-
              [{"local-path":"./.dev-alchemy/cache/windows11/iso/win11_25h2_english_arm64.iso","container":"build-cache"},
               {"local-path":"./.dev-alchemy/cache/utm/utm-guest-tools-latest.iso"},
               {"local-path":"./.dev-alchemy/cache/windows/virtio-win.iso"},
               {"local-path":"./.dev-alchemy/cache/qemu-efi-aarch64_all.deb"}]
          - vm_os: windows11
            go_test_name: TestBuildQemuWindows11Amd64OnMacos
            deploy_test_name: TestDeployUtmWindows11Amd64OnMacos
            runs_on: macos-26
            tart_runs_on: macos-26-tart
            packer_start_only: "false"
            packer_start_timeout: "180"
            cache_files: >-
              [{"local-path":"./.dev-alchemy/cache/windows11/iso/win11_25h2_english_amd64.iso","container":"build-cache"},
               {"local-path":"./.dev-alchemy/cache/utm/utm-guest-tools-latest.iso"}]
          - vm_os: ubuntu
            go_test_name: TestBuildQemuUbuntuServerArm64OnMacos
            deploy_test_name: TestDeployUtmUbuntuServerArm64OnMacos
            runs_on: macos-26
            tart_runs_on: macos-26-tart
            packer_start_only: "true"
            packer_start_timeout: "180"
            cache_files: >-
              [{"local-path":"./.dev-alchemy/cache/linux/ubuntu-24.04.4-live-server-arm64.iso"},
               {"local-path":"./.dev-alchemy/cache/qemu-efi-aarch64_all.deb"}]
          - vm_os: ubuntu
            go_test_name: TestBuildQemuUbuntuServerAmd64OnMacos
            deploy_test_name: TestDeployUtmUbuntuServerAmd64OnMacos
            runs_on: macos-26
            tart_runs_on: macos-26-tart
            packer_start_only: "true"
            packer_start_timeout: "180"
            cache_files: >-
              [{"local-path":"./.dev-alchemy/cache/linux/ubuntu-24.04.4-live-server-amd64.iso"}]
          - vm_os: ubuntu
            go_test_name: TestBuildQemuUbuntuDesktopArm64OnMacos
            deploy_test_name: TestDeployUtmUbuntuDesktopArm64OnMacos
            runs_on: macos-26
            tart_runs_on: macos-26-tart
            packer_start_only: "true"
            packer_start_timeout: "180"
            cache_files: >-
              [{"local-path":"./.dev-alchemy/cache/linux/ubuntu-24.04.4-live-server-arm64.iso"},
               {"local-path":"./.dev-alchemy/cache/qemu-efi-aarch64_all.deb"}]
          - vm_os: ubuntu
            go_test_name: TestBuildQemuUbuntuDesktopAmd64OnMacos
            deploy_test_name: TestDeployUtmUbuntuDesktopAmd64OnMacos
            runs_on: macos-26
            tart_runs_on: macos-26-tart
            packer_start_only: "true"
            packer_start_timeout: "180"
            cache_files: >-
              [{"local-path":"./.dev-alchemy/cache/linux/ubuntu-24.04.4-live-server-amd64.iso"}]
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Download build cache files
        uses: ./.github/actions/download-build-cache
        with:
          storage-backend: ftp
          files: ${{ matrix.cache_files }}
          ftp-server: ${{ vars.BUILD_CACHE_FTP_SERVER }}
          ftp-port: ${{ vars.BUILD_CACHE_FTP_PORT }}
          ftp-username: ${{ secrets.BUILD_CACHE_FTP_USERNAME }}
          ftp-password: ${{ secrets.BUILD_CACHE_FTP_PASSWORD }}
          ftp-base-dir: /private

      - name: Set up Python
        uses: actions/setup-python@v6
        if: matrix.runs_on != 'windows-2025'
        with:
          python-version: "3.13"

      - name: Install dependencies macos
        if: contains(matrix.runs_on, 'macos')
        run: |
          go run cmd/main.go install

      - name: Run build for VM OS=${{ matrix.vm_os }} TEST_NAME=${{ matrix.go_test_name }} on runner OS=${{ vars.USE_TART_MACOS_RUNNERS == 'true' && matrix.tart_runs_on || matrix.runs_on }}
        id: packer_build
        shell: bash
        continue-on-error: true
        env:
          RUN_INTEGRATION_TESTS: "1"
          DEV_ALCHEMY_PACKER_START_ONLY: ${{ matrix.packer_start_only }}
          DEV_ALCHEMY_PACKER_START_TIMEOUT: ${{ matrix.packer_start_timeout }}
          PACKER_LOG: 1
          PACKER_GITHUB_API_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          go mod vendor
          sudo -E make test-build-specific TEST_NAME=${{ matrix.go_test_name }}

      - name: Normalize managed app-data ownership after sudo build
        if: always() && contains(matrix.runs_on, 'macos')
        run: |
          if [ -d ./.dev-alchemy ]; then
            sudo chown -R "$(id -u):$(id -g)" ./.dev-alchemy
          fi

      - name: Run deploy smoke test TEST_NAME=${{ matrix.deploy_test_name }}
        if: steps.packer_build.outcome == 'success' && matrix.packer_start_only != 'true'
        id: deploy_smoke
        shell: bash
        continue-on-error: true
        env:
          RUN_INTEGRATION_TESTS: "1"
          RUN_MACOS_UTM_DEPLOY_SMOKE: "1"
        run: |
          go test -timeout 60m -v ./pkg/deploy -run "^${{ matrix.deploy_test_name }}$"

      - name: Move .vnc.mp4 files to artifact directory
        if: contains(matrix.runs_on, 'macos')
        run: |
          mkdir -p artifact
          if [ -d ./.dev-alchemy/cache ]; then
            find ./.dev-alchemy/cache -name '*.vnc.mp4' -exec cp {} artifact/ \;
          fi

      - name: Upload Playwright diagnostics artifact (always)
        if: always() && contains(matrix.runs_on, 'macos')
        uses: actions/upload-artifact@v7
        with:
          name: playwright-diagnostics-${{ matrix.vm_os }}-${{ matrix.go_test_name }}
          path: ./.dev-alchemy/cache/windows/playwright-diagnostics/**
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload packer-qemu-${{ matrix.vm_os }}-${{ matrix.go_test_name }}.vnc.mp4 artifact (always)
        if: contains(matrix.runs_on, 'macos')
        uses: actions/upload-artifact@v7
        with:
          name: packer-qemu-${{ matrix.vm_os }}-${{ matrix.go_test_name }}.vnc.mp4
          path: artifact/*.vnc.mp4
          retention-days: 1

      - name: Upload build cache files
        uses: ./.github/actions/upload-build-cache
        with:
          storage-backend: ftp
          files: ${{ matrix.cache_files }}
          ftp-server: ${{ vars.BUILD_CACHE_FTP_SERVER }}
          ftp-port: ${{ vars.BUILD_CACHE_FTP_PORT }}
          ftp-username: ${{ secrets.BUILD_CACHE_FTP_USERNAME }}
          ftp-password: ${{ secrets.BUILD_CACHE_FTP_PASSWORD }}
          ftp-base-dir: /private

      - name: Fail if build or deploy smoke test failed
        if: always() && (steps.packer_build.outcome == 'failure' || steps.deploy_smoke.outcome == 'failure')
        run: |
          echo "Build and/or deploy smoke test failed. Failing workflow."
          exit 1
