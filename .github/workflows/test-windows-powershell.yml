name: Test Windows PowerShell Scripts

permissions:
  contents: read

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "scripts/windows/*.ps1"
      - "scripts/windows/**/*.ps1"
      - "scripts/install.ps1"
      - "test/install/*.ps1"
      - "cmd/cmd/install.go"
      - "pkg/provision/**"
      - ".github/workflows/test-windows-powershell.yml"

jobs:
  windows-powershell:
    name: Parser, analyzer, and Pester
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Install PowerShell test modules
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          Set-PSRepository -Name PSGallery -InstallationPolicy Trusted
          Install-Module -Name PSScriptAnalyzer -Scope CurrentUser -Force -SkipPublisherCheck
          Install-Module -Name Pester -MinimumVersion 5.5.0 -Scope CurrentUser -Force -SkipPublisherCheck

      - name: Parse and analyze Windows scripts
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $scripts = @(
              @(Get-ChildItem -Path "scripts/windows" -Filter "*.ps1" -Recurse) +
              @(Get-Item -Path "scripts/install.ps1") +
              @(Get-ChildItem -Path "test/install" -Filter "*.ps1") |
                  Sort-Object FullName
          )
          if ($scripts.Count -eq 0) {
              Write-Output "No Windows PowerShell scripts found."
              exit 0
          }

          foreach ($script in $scripts) {
              $tokens = $null
              $errors = $null
              [System.Management.Automation.Language.Parser]::ParseFile($script.FullName, [ref] $tokens, [ref] $errors) | Out-Null
              if ($errors.Count -gt 0) {
                  $errors | Format-List | Out-String | Write-Error
                  throw "PowerShell parser errors found in $($script.FullName)."
              }
          }

          Import-Module PSScriptAnalyzer
          $excludedRules = @(
              "PSAvoidUsingConvertToSecureStringWithPlainText",
              "PSAvoidUsingInvokeExpression",
              "PSAvoidUsingWriteHost",
              "PSUseApprovedVerbs",
              "PSUseShouldProcessForStateChangingFunctions",
              "PSUseSingularNouns"
          )
          $issues = @(
              foreach ($script in $scripts) {
                  Invoke-ScriptAnalyzer `
                      -Path $script.FullName `
                      -Severity Warning,Error `
                      -ExcludeRule $excludedRules
              }
          )

          if ($issues.Count -gt 0) {
              $issues | Format-List | Out-String | Write-Error
              throw "PowerShell analyzer issues found."
          }

      - name: Run Pester tests
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          Import-Module Pester -MinimumVersion 5.5.0
          $config = New-PesterConfiguration
          $config.Run.Path = "scripts/windows"
          $config.Run.PassThru = $true
          $config.Output.Verbosity = "Detailed"
          $config.TestResult.Enabled = $true
          $config.TestResult.OutputPath = "TestResults-WindowsPowerShell.xml"

          $result = Invoke-Pester -Configuration $config
          if ($result.FailedCount -gt 0) {
              throw "$($result.FailedCount) Pester test(s) failed."
          }

  github-hosted-self-setup:
    # GitHub-hosted runners preinstall tools such as Git for Windows and the
    # Azure CLI outside Chocolatey, often newer than the pinned versions. Run the
    # real host setup there so installer conflicts (e.g. MSI downgrade refusals)
    # surface before a release reaches users of these runners.
    name: sailwright install and provision --check (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os:
          - windows-2025

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Record preinstalled tool versions
        shell: pwsh
        run: |
          foreach ($command in @("git", "az", "choco")) {
              $resolved = Get-Command $command -ErrorAction SilentlyContinue
              if ($resolved) {
                  Write-Output "$command -> $($resolved.Source)"
              } else {
                  Write-Output "$command -> not installed"
              }
          }
          git --version
          az version --output json
          Get-ChildItem -Path "HKLM:\SOFTWARE\Python\PythonCore" -ErrorAction SilentlyContinue |
              ForEach-Object { Write-Output "PythonCore $($_.PSChildName) -> $((Get-ItemProperty -Path "$($_.PSPath)\InstallPath" -ErrorAction SilentlyContinue).'(default)')" }

      - name: Run sailwright install
        shell: pwsh
        run: go run ./cmd/main.go install

      - name: Verify preinstalled tools still work
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          git --version
          if ($LASTEXITCODE -ne 0) { throw "git is not usable after sailwright install." }
          az version --output json
          if ($LASTEXITCODE -ne 0) { throw "az is not usable after sailwright install." }
          python --version
          if ($LASTEXITCODE -ne 0) { throw "python is not usable after sailwright install." }

      # Keep pwsh: Windows PowerShell children of a pwsh process inherit its
      # PSModulePath, which broke the local WinRM bootstrap (missing Cert: drive).
      - name: Run sailwright provision local --check
        shell: pwsh
        run: go run ./cmd/main.go provision local --check --yes
