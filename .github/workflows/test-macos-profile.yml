name: Test macOS profile on Linux
permissions:
  contents: read
on:
  workflow_dispatch: null
  pull_request:
    paths:
      - cmd/main.go
      - cmd/cmd/**
      - build/packer/linux/*
      - build/packer/linux/**/*
      - build/packer/windows/*
      - build/packer/windows/**/*
      - pkg/build/**
      - pkg/deploy/**
      - deployments/utm/**
      - scripts/linux/*
      - scripts/linux/**/*
      - scripts/macos/*
      - scripts/macos/**/*
      - scripts/windows/*
      - scripts/windows/**/*
      - .github/workflows/test-build-macos.yml
      - .github/actions/download-build-cache/**
      - .github/actions/upload-build-cache/**
      - test/macos-profile/**
      - Makefile
      - go.mod
      - go.sum
      - .github/workflows/test-macos-profile.yml
jobs:
  macos-profile:
    runs-on: ${{ matrix.arch == 'arm64' && 'ubuntu-24.04-arm' || 'ubuntu-24.04' }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        arch:
          - amd64
          - arm64
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - uses: hashicorp/setup-packer@v3
        with:
          version: 1.16.2
      - name: Install fixture tools
        run: |-
          sudo apt-get update
          sudo apt-get install -y qemu-utils dosfstools mtools swtpm gettext-base uuid-runtime rsync xorriso
      - name: Compare Darwin QEMU arguments
        run: make test-macos-profile MACOS_PROFILE_ARCH=${{ matrix.arch }}
      - name: Compile Darwin packages
        if: matrix.arch == 'arm64'
        run: make test-macos-profile-go
      - name: Check shell portability and UTM bundles
        if: matrix.arch == 'arm64'
        run: make test-macos-profile-shell
      - name: Check macOS system Bash compatibility
        if: matrix.arch == 'arm64'
        run: |-
          docker run --rm -v "$PWD:/repo:ro" -w /repo bash:3.2 sh -c '
            apk add --no-cache python3 gawk
            python3 test/macos-profile/lint.py
            bash test/macos-profile/test-shell.sh
          '
