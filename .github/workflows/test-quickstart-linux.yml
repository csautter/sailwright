name: Test Quick-Start Workflow on Linux

permissions:
  contents: read

on:
  workflow_dispatch:
    inputs:
      ubuntu_type:
        description: "Ubuntu type to exercise"
        required: false
        default: "server"
        type: choice
        options:
          - server
          - desktop
      arch:
        description: "Target architecture"
        required: false
        default: "amd64"
        type: choice
        options:
          - amd64
          - arm64
      skip_build:
        description: "Skip packer build and pull a prebuilt OCI artifact instead (much faster)"
        required: false
        default: true
        type: boolean
      keep:
        description: "Keep the VM at the end instead of stop+destroy"
        required: false
        default: false
        type: boolean
  push:
    branches: [main]
    paths:
      - "scripts/quickstart.sh"
      - "scripts/linux/sailwright-install-dependencies.sh"
      - ".github/workflows/test-quickstart-linux.yml"
      - "Makefile"
  pull_request:
    paths:
      - "scripts/quickstart.sh"
      - "scripts/linux/sailwright-install-dependencies.sh"
      - ".github/workflows/test-quickstart-linux.yml"
      - "Makefile"

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

env:
  OCI_UBUNTU_IMAGE: ghcr.io/${{ github.repository_owner }}/ubuntu-24

jobs:
  # Cheap validation that runs on every PR/push touching the script. Does not
  # boot a VM, so it is safe on standard runners.
  lint-quickstart:
    name: Lint quickstart script
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Syntax check
        run: bash -n scripts/quickstart.sh

      - name: ShellCheck
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck
          shellcheck scripts/quickstart.sh

  # Full recorded end-to-end run. Boots a real VM, so it is manual-only
  # (workflow_dispatch) to avoid spending heavy CI time on every PR.
  quickstart-e2e:
    name: Recorded quick-start e2e (${{ inputs.ubuntu_type || 'server' }} ${{ inputs.arch || 'amd64' }})
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      contents: read
      packages: read
    env:
      DEV_ALCHEMY_APP_DATA_DIR: ${{ github.workspace }}/.dev-alchemy
      DEV_ALCHEMY_CACHE_DIR: ${{ github.workspace }}/.dev-alchemy/cache
      # GitHub-hosted ubuntu-24.04 runners expose /dev/kvm. If a runner without
      # KVM is used, set DEV_ALCHEMY_QEMU_FORCE_SOFTWARE_EMULATION=1 here to fall
      # back to (much slower) TCG software emulation.
      # Credentials for the packer-built Ubuntu image (see docs/testing-workflows.md).
      LIBVIRT_UBUNTU_ANSIBLE_USER: packer
      LIBVIRT_UBUNTU_ANSIBLE_PASSWORD: "P@ssw0rd!"
      LIBVIRT_UBUNTU_ANSIBLE_BECOME_PASSWORD: "P@ssw0rd!"
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Install dependencies (incl. ffmpeg, vncsnapshot, asciinema)
        run: go run cmd/main.go install

      - name: Enable libvirt default network
        run: |
          sudo virsh net-start default || true
          sudo virsh net-autostart default || true

      - name: Pull prebuilt Ubuntu artifact (when skipping build)
        if: ${{ inputs.skip_build }}
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          go run cmd/main.go pull \
            "${OCI_UBUNTU_IMAGE}:${{ inputs.ubuntu_type }}-${{ inputs.arch }}-linux-build" \
            --os ubuntu \
            --type "${{ inputs.ubuntu_type }}" \
            --arch "${{ inputs.arch }}" \
            --host-os linux

      - name: Run recorded quick-start workflow
        id: quickstart
        run: |
          args="--skip-install --type ${{ inputs.ubuntu_type }} --arch ${{ inputs.arch }} --record-dir artifact"
          if [[ "${{ inputs.skip_build }}" == "true" ]]; then
            args="$args --skip-build"
          fi
          if [[ "${{ inputs.keep }}" == "true" ]]; then
            args="$args --keep"
          fi
          # shellcheck disable=SC2086
          bash scripts/quickstart.sh $args

      - name: Upload recordings (always)
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: quickstart-recordings-${{ inputs.ubuntu_type }}-${{ inputs.arch }}
          path: |
            artifact/*.vnc.mp4
            artifact/*.cast
            artifact/*.typescript
          if-no-files-found: warn
          retention-days: 7
