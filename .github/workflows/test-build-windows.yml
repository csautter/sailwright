name: Test Packer Build on Windows for VMs

permissions:
  contents: read
  id-token: write

on:
  workflow_dispatch:
    inputs:
      enable_az_virtualbox:
        description: 'Enable Azure VirtualBox jobs (provision + test + cleanup)'
        required: false
        default: true
        type: boolean
  pull_request:
    types: [opened, synchronize, reopened, labeled]
  schedule:
    - cron: '0 4 * * 1'

concurrency:
  # Unrelated labels must never cancel a running PR build.
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event_name == 'pull_request' && (github.event.action != 'labeled' || github.event.label.name == 'ci:hyperv') && github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  select:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      hyperv: ${{ steps.route.outputs.hyperv }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - id: route
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 test/hyperv-profile/routes.py

  preflight:
    needs: [select]
    if: needs.select.outputs.hyperv == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: hashicorp/setup-packer@v3
      - run: go test ./pkg/build
      - run: packer validate -syntax-only build/packer/windows/windows11-on-windows-hyperv.pkr.hcl

  provision-hyperv-runner:
    needs: [select, preflight]
    if: needs.select.outputs.hyperv == 'true'
    runs-on: ubuntu-latest
    outputs:
      runner-name: ${{ steps.vars.outputs.runner-name }}
      resource-group: ${{ steps.vars.outputs.resource-group }}

    steps:
      - name: Azure Login (OIDC)
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Generate names
        id: vars
        run: |
          echo "runner-name=${GITHUB_RUN_ID}-hv" >> $GITHUB_OUTPUT
          echo "resource-group=gh-runner-tmp-${GITHUB_RUN_ID}-hv" >> $GITHUB_OUTPUT

      - name: Checkout provisioning scripts
        uses: actions/checkout@v7
        with:
          persist-credentials: false
          sparse-checkout: scripts/gh-runner-func
          sparse-checkout-cone-mode: false

      - name: Request Windows Runner VM
        id: request
        run: |
          echo "Creating Windows VM in resource group ${{ steps.vars.outputs.resource-group }} with runner name ${{ steps.vars.outputs.runner-name }}"
          response="$(az rest \
            --method post \
            --uri "https://${{ secrets.FUNCTION_APP_NAME }}.azurewebsites.net/api/request_runner" \
            --resource "api://${{ secrets.AZURE_CLIENT_ID }}" \
            --headers "X-Correlation-ID=${{ github.run_id }}-${{ github.run_attempt }}-hv" \
            --body '{
              "repo": "${{ github.repository }}",
              "resource-group": "${{ steps.vars.outputs.resource-group }}",
              "runner-name": "${{ steps.vars.outputs.runner-name }}",
              "virtualization-flavor": "hyperv"
            }')"
          echo "${response}"
          vm="$(python3 -c 'import json, sys; print(json.load(sys.stdin)["vm"])' <<< "${response}")"
          echo "vm=${vm}" >> "$GITHUB_OUTPUT"
          monitor_status="$(python3 -c 'import json, sys; print("true" if json.load(sys.stdin).get("status-url") == "/api/runner_status" else "false")' <<< "${response}")"
          echo "monitor-status=${monitor_status}" >> "$GITHUB_OUTPUT"
          if [[ "${monitor_status}" != "true" ]]; then
            echo "::notice::Broker does not advertise runner_status; skipping VM status polling. Deploy the updated Function App to enable it."
          fi

      # Fail fast when Azure rejects or evicts the VM after accepting it,
      # instead of waiting for a runner that never registers. cleanup-* still
      # deletes the resource group.
      - name: Wait for Runner VM provisioning
        if: steps.request.outputs.monitor-status == 'true'
        env:
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          FUNCTION_APP_NAME: ${{ secrets.FUNCTION_APP_NAME }}
          RESOURCE_GROUP: ${{ steps.vars.outputs.resource-group }}
          VM_NAME: ${{ steps.request.outputs.vm }}
          PROVISION_TIMEOUT_SECONDS: "900"
        run: bash scripts/gh-runner-func/wait-runner-provisioned.sh

  provision-virtualbox-runner:
    # if: ${{ github.event_name == 'pull_request' || inputs.enable_az_virtualbox }}
    # TODO: Re-enable after fixing VirtualBox provisioning issue
    if: false 
    runs-on: ubuntu-latest
    outputs:
      runner-name: ${{ steps.vars.outputs.runner-name }}
      resource-group: ${{ steps.vars.outputs.resource-group }}

    steps:
      - name: Azure Login (OIDC)
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Generate names
        id: vars
        run: |
          echo "runner-name=${GITHUB_RUN_ID}-vb" >> $GITHUB_OUTPUT
          echo "resource-group=gh-runner-tmp-${GITHUB_RUN_ID}-vb" >> $GITHUB_OUTPUT

      - name: Checkout provisioning scripts
        uses: actions/checkout@v7
        with:
          persist-credentials: false
          sparse-checkout: scripts/gh-runner-func
          sparse-checkout-cone-mode: false

      - name: Request Windows Runner VM
        id: request
        run: |
          echo "Creating Windows VM in resource group ${{ steps.vars.outputs.resource-group }} with runner name ${{ steps.vars.outputs.runner-name }}"
          response="$(az rest \
            --method post \
            --uri "https://${{ secrets.FUNCTION_APP_NAME }}.azurewebsites.net/api/request_runner" \
            --resource "api://${{ secrets.AZURE_CLIENT_ID }}" \
            --headers "X-Correlation-ID=${{ github.run_id }}-${{ github.run_attempt }}-vb" \
            --body '{
              "repo": "${{ github.repository }}",
              "resource-group": "${{ steps.vars.outputs.resource-group }}",
              "runner-name": "${{ steps.vars.outputs.runner-name }}",
              "virtualization-flavor": "virtualbox"
            }')"
          echo "${response}"
          vm="$(python3 -c 'import json, sys; print(json.load(sys.stdin)["vm"])' <<< "${response}")"
          echo "vm=${vm}" >> "$GITHUB_OUTPUT"
          monitor_status="$(python3 -c 'import json, sys; print("true" if json.load(sys.stdin).get("status-url") == "/api/runner_status" else "false")' <<< "${response}")"
          echo "monitor-status=${monitor_status}" >> "$GITHUB_OUTPUT"
          if [[ "${monitor_status}" != "true" ]]; then
            echo "::notice::Broker does not advertise runner_status; skipping VM status polling. Deploy the updated Function App to enable it."
          fi

      # Fail fast when Azure rejects or evicts the VM after accepting it,
      # instead of waiting for a runner that never registers. cleanup-* still
      # deletes the resource group.
      - name: Wait for Runner VM provisioning
        if: steps.request.outputs.monitor-status == 'true'
        env:
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          FUNCTION_APP_NAME: ${{ secrets.FUNCTION_APP_NAME }}
          RESOURCE_GROUP: ${{ steps.vars.outputs.resource-group }}
          VM_NAME: ${{ steps.request.outputs.vm }}
          PROVISION_TIMEOUT_SECONDS: "900"
        run: bash scripts/gh-runner-func/wait-runner-provisioned.sh

  test-hyperv-build:
    name: build TestBuildHypervWindows11Amd64OnWindows
    needs: [provision-hyperv-runner]
    timeout-minutes: 60
    env:
      # Build jobs resolve the Windows 11 ISO through the cache manifest and never contact Microsoft.
      SAILWRIGHT_WIN11_ISO_OFFLINE: "1"
      DEV_ALCHEMY_APP_DATA_DIR: ${{ github.workspace }}\.dev-alchemy
      DEV_ALCHEMY_CACHE_DIR: ${{ github.workspace }}\.dev-alchemy\cache
      DEV_ALCHEMY_VAGRANT_DIR: ${{ github.workspace }}\.dev-alchemy\.vagrant
      DEV_ALCHEMY_PACKER_CACHE_DIR: ${{ github.workspace }}\.dev-alchemy\packer_cache
      PACKER_CACHE_DIR: ${{ github.workspace }}\.dev-alchemy\packer_cache
      PACKER_TEMP_PATH: "D:\\hyperv-temp" # Use Azure VM temp disk for packer temp files to speed up build
    runs-on:
      - self-hosted
      - Windows
      - azure
      - nested
      - "${{ github.run_id }}-hv"

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Download build cache files
        uses: ./.github/actions/download-build-cache
        with:
          storage-backend: ftp
          files: '[{"local-path":"./.dev-alchemy/cache/windows11/iso/win11_english_amd64.iso","manifest":"windows11/iso/win11-amd64.json","blob-name":"win11_25h2_english_amd64.iso"}]'
          ftp-server: ${{ vars.BUILD_CACHE_FTP_SERVER }}
          ftp-port: ${{ vars.BUILD_CACHE_FTP_PORT }}
          ftp-username: ${{ secrets.BUILD_CACHE_FTP_USERNAME }}
          ftp-password: ${{ secrets.BUILD_CACHE_FTP_PASSWORD }}
          ftp-base-dir: /private

      - name: Install dependencies windows
        shell: powershell
        run: |
          powershell -ExecutionPolicy Bypass -File scripts/windows/install_oscdimg.ps1
          go mod vendor
          go run cmd/main.go install

      - name: Run HyperV build
        id: packer_build
        shell: bash
        continue-on-error: true
        env:
          RUN_INTEGRATION_TESTS: "1"
          PACKER_LOG: 1
          PACKER_GITHUB_API_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          make test-build-specific TEST_NAME=TestBuildHypervWindows11Amd64OnWindows

      - name: Run HyperV deploy smoke test
        if: steps.packer_build.outcome == 'success'
        id: deploy_smoke
        shell: bash
        continue-on-error: true
        env:
          RUN_INTEGRATION_TESTS: "1"
          RUN_WINDOWS_HYPERV_DEPLOY_SMOKE: "1"
        run: |
          go test -timeout 60m -v ./pkg/deploy -run "^TestRunHypervVagrantDeployOnWindows_Smoke$"

      - name: Collect HyperV diagnostics
        if: always()
        shell: powershell
        run: |
          $artifactDir = Join-Path $env:GITHUB_WORKSPACE "artifact\hyperv-diagnostics"
          $diagnosticsZip = Join-Path $env:GITHUB_WORKSPACE "artifact\hyperv-diagnostics-TestBuildHypervWindows11Amd64OnWindows.zip"
          New-Item -ItemType Directory -Force -Path $artifactDir | Out-Null

          $paths = @(
            (Join-Path $env:GITHUB_WORKSPACE ".dev-alchemy\cache\windows\hyperv-diagnostics"),
            "C:\ProgramData\dev-alchemy\logs\runner-setup.log",
            "C:\execution.log"
          )

          foreach ($path in $paths) {
            if (Test-Path $path) {
              Copy-Item -Path $path -Destination $artifactDir -Recurse -Force
            }
          }
          
          if (Get-ChildItem -Path $artifactDir -Force -ErrorAction SilentlyContinue) {
            if (Test-Path $diagnosticsZip) {
              Remove-Item -Path $diagnosticsZip -Force
            }
            Compress-Archive -Path (Join-Path $artifactDir '*') -DestinationPath $diagnosticsZip -Force
          }

      - name: Upload build cache files
        uses: ./.github/actions/upload-build-cache
        with:
          storage-backend: ftp
          files: '[{"local-path":"./.dev-alchemy/cache/windows11/iso/win11_english_amd64.iso","manifest":"windows11/iso/win11-amd64.json","blob-name":"win11_25h2_english_amd64.iso"},{"local-path":"./artifact/hyperv-diagnostics-TestBuildHypervWindows11Amd64OnWindows.zip","blob-name":"hyperv-diagnostics-TestBuildHypervWindows11Amd64OnWindows.zip","container":"build-cache","overwrite":true}]'
          ftp-server: ${{ vars.BUILD_CACHE_FTP_SERVER }}
          ftp-port: ${{ vars.BUILD_CACHE_FTP_PORT }}
          ftp-username: ${{ secrets.BUILD_CACHE_FTP_USERNAME }}
          ftp-password: ${{ secrets.BUILD_CACHE_FTP_PASSWORD }}
          ftp-base-dir: /private

      - name: Fail if build or deploy smoke test failed
        if: always() && (steps.packer_build.outcome == 'failure' || steps.deploy_smoke.outcome == 'failure')
        run: |
          echo "Build and/or deploy smoke test failed. Failing workflow."
          exit 1

  watch-hyperv-runner-queue:
    name: watch HyperV runner queue
    needs: [provision-hyperv-runner]
    runs-on: ubuntu-latest
    # 15 min queue wait (WAIT_TIMEOUT_SECONDS) + up to 20 min to confirm the
    # resource group deletion (DELETE_TIMEOUT_SECONDS default) + slack.
    timeout-minutes: 45
    permissions:
      actions: write
      id-token: write

    steps:
      - name: Wait for HyperV build job to leave queue
        id: watch_queue
        env:
          GH_TOKEN: ${{ github.token }}
          POLL_INTERVAL_SECONDS: "30"
          REPO: ${{ github.repository }}
          RESOURCE_GROUP: gh-runner-tmp-${{ github.run_id }}-hv
          RUN_ID: ${{ github.run_id }}
          TARGET_JOB_NAME: "build TestBuildHypervWindows11Amd64OnWindows"
          WAIT_TIMEOUT_SECONDS: "900"
        run: |
          deadline=$(( $(date +%s) + WAIT_TIMEOUT_SECONDS ))
          github_api_version="2022-11-28"
          cleanup_required=false

          while true; do
            now=$(date +%s)
            jobs_json="$(
              curl -fsSL \
                -H "Accept: application/vnd.github+json" \
                -H "Authorization: Bearer ${GH_TOKEN}" \
                -H "X-GitHub-Api-Version: ${github_api_version}" \
                "https://api.github.com/repos/${REPO}/actions/runs/${RUN_ID}/jobs?per_page=100"
            )"
            job_state="$(
              TARGET_JOB_NAME="${TARGET_JOB_NAME}" python3 -c 'import json, os, sys; target_name = os.environ["TARGET_JOB_NAME"]; match = next((job for job in json.load(sys.stdin).get("jobs", []) if job.get("name") == target_name), None); print((match.get("status", "") if match else "") + "\t" + ((match.get("conclusion") or "") if match else ""))' <<< "${jobs_json}"
            )"
            IFS=$'\t' read -r job_status job_conclusion <<< "${job_state}"

            if [[ -n "${job_status}" ]]; then
              echo "Observed ${TARGET_JOB_NAME}: status=${job_status} conclusion=${job_conclusion:-none}"
            else
              echo "Waiting for ${TARGET_JOB_NAME} to appear in workflow jobs list"
            fi

            if [[ "${job_status}" == "in_progress" || "${job_status}" == "completed" ]]; then
              echo "${TARGET_JOB_NAME} has left the queue"
              exit 0
            fi

            if (( now >= deadline )); then
              echo "${TARGET_JOB_NAME} stayed queued too long. Preparing cleanup for ${RESOURCE_GROUP}."
              cleanup_required=true
              break
            fi

            sleep "${POLL_INTERVAL_SECONDS}"
          done

          echo "cleanup_required=${cleanup_required}" >> "${GITHUB_OUTPUT}"

      - name: Azure Login (OIDC)
        if: steps.watch_queue.outputs.cleanup_required == 'true'
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Checkout cleanup script
        if: steps.watch_queue.outputs.cleanup_required == 'true'
        uses: actions/checkout@v7
        with:
          persist-credentials: false
          sparse-checkout: scripts/gh-runner-func
          sparse-checkout-cone-mode: false

      - name: Delete timed out HyperV resource group and cancel workflow run
        if: steps.watch_queue.outputs.cleanup_required == 'true'
        env:
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          FUNCTION_APP_NAME: ${{ secrets.FUNCTION_APP_NAME }}
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RESOURCE_GROUP: gh-runner-tmp-${{ github.run_id }}-hv
          RUN_ID: ${{ github.run_id }}
          RUNNER_NAME: ${{ github.run_id }}-hv
        run: |
          github_api_version="2022-11-28"

          if ! bash scripts/gh-runner-func/delete-resource-group.sh; then
            echo "Failed to confirm deletion of ${RESOURCE_GROUP}. Leaving workflow active so cleanup-hyperv can retry."
            exit 1
          fi

          echo "Confirmed cleanup for ${RESOURCE_GROUP}. Canceling workflow run ${RUN_ID}."

          curl -fsSL \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: ${github_api_version}" \
            "https://api.github.com/repos/${REPO}/actions/runs/${RUN_ID}/force-cancel" >/dev/null || \
          curl -fsSL \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: ${github_api_version}" \
            "https://api.github.com/repos/${REPO}/actions/runs/${RUN_ID}/cancel" >/dev/null || true

          exit 1

  test-virtualbox-build:
    # if: ${{ github.event_name == 'pull_request' || inputs.enable_az_virtualbox }}
    # TODO: Re-enable after fixing VirtualBox provisioning issue
    if: false 
    name: build TestBuildVirtualBoxWindows11Amd64OnWindows
    needs: [provision-virtualbox-runner]
    timeout-minutes: 80
    env:
      # Build jobs resolve the Windows 11 ISO through the cache manifest and never contact Microsoft.
      SAILWRIGHT_WIN11_ISO_OFFLINE: "1"
      DEV_ALCHEMY_APP_DATA_DIR: ${{ github.workspace }}\.dev-alchemy
      DEV_ALCHEMY_CACHE_DIR: ${{ github.workspace }}\.dev-alchemy\cache
      DEV_ALCHEMY_VAGRANT_DIR: ${{ github.workspace }}\.dev-alchemy\.vagrant
      DEV_ALCHEMY_PACKER_CACHE_DIR: ${{ github.workspace }}\.dev-alchemy\packer_cache
      PACKER_CACHE_DIR: ${{ github.workspace }}\.dev-alchemy\packer_cache
      PACKER_TEMP_PATH: "D:\\vbox-temp" # Use Azure VM temp disk for packer temp files to speed up build
    runs-on:
      - self-hosted
      - Windows
      - azure
      - nested
      - "${{ needs.provision-virtualbox-runner.outputs.runner-name }}"

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Download build cache files
        uses: ./.github/actions/download-build-cache
        with:
          storage-backend: ftp
          files: '[{"local-path":"./.dev-alchemy/cache/windows11/iso/win11_english_amd64.iso","manifest":"windows11/iso/win11-amd64.json","blob-name":"win11_25h2_english_amd64.iso"}]'
          ftp-server: ${{ vars.BUILD_CACHE_FTP_SERVER }}
          ftp-port: ${{ vars.BUILD_CACHE_FTP_PORT }}
          ftp-username: ${{ secrets.BUILD_CACHE_FTP_USERNAME }}
          ftp-password: ${{ secrets.BUILD_CACHE_FTP_PASSWORD }}
          ftp-base-dir: /private

      - name: Install dependencies windows
        shell: powershell
        run: |
          powershell -ExecutionPolicy Bypass -File scripts/windows/install_oscdimg.ps1
          go mod vendor
          go run cmd/main.go install --virtualbox

      - name: Run VirtualBox build
        id: packer_build
        shell: bash
        continue-on-error: true
        env:
          RUN_INTEGRATION_TESTS: "1"
          PACKER_LOG: 1
          PACKER_GITHUB_API_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          make test-build-specific TEST_NAME=TestBuildVirtualBoxWindows11Amd64OnWindows
          make test-deploy-windows-hyperv

      - name: Upload build cache files
        uses: ./.github/actions/upload-build-cache
        with:
          storage-backend: ftp
          files: '[{"local-path":"./.dev-alchemy/cache/windows11/iso/win11_english_amd64.iso","manifest":"windows11/iso/win11-amd64.json","blob-name":"win11_25h2_english_amd64.iso"}]'
          ftp-server: ${{ vars.BUILD_CACHE_FTP_SERVER }}
          ftp-port: ${{ vars.BUILD_CACHE_FTP_PORT }}
          ftp-username: ${{ secrets.BUILD_CACHE_FTP_USERNAME }}
          ftp-password: ${{ secrets.BUILD_CACHE_FTP_PASSWORD }}
          ftp-base-dir: /private

      - name: Fail if Packer build failed
        if: steps.packer_build.outcome == 'failure'
        run: |
          echo "Packer build failed. Failing workflow."
          exit 1

  cleanup-hyperv:
    needs: [provision-hyperv-runner, test-hyperv-build, watch-hyperv-runner-queue]
    if: always() && needs.provision-hyperv-runner.result != 'skipped'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout cleanup script
        uses: actions/checkout@v7
        with:
          persist-credentials: false
          sparse-checkout: scripts/gh-runner-func
          sparse-checkout-cone-mode: false

      - name: Azure Login (OIDC)
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Delete HyperV resource group
        env:
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          FUNCTION_APP_NAME: ${{ secrets.FUNCTION_APP_NAME }}
          RESOURCE_GROUP: gh-runner-tmp-${{ github.run_id }}-hv
          RUNNER_NAME: ${{ github.run_id }}-hv
        run: |
          echo "Deleting resource group ${RESOURCE_GROUP}"
          bash scripts/gh-runner-func/delete-resource-group.sh

  cleanup-virtualbox:
    needs: [provision-virtualbox-runner, test-virtualbox-build]
    # if: always() && (github.event_name == 'pull_request' || inputs.enable_az_virtualbox)
    # TODO: Re-enable after fixing VirtualBox provisioning issue
    if: false 
    runs-on: ubuntu-latest

    steps:
      - name: Azure Login (OIDC)
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Delete VirtualBox resource group
        run: |
          echo "Deleting resource group ${{ needs.provision-virtualbox-runner.outputs.resource-group }}"
          az rest \
            --method post \
            --uri "https://${{ secrets.FUNCTION_APP_NAME }}.azurewebsites.net/api/delete_resource_group" \
            --resource "api://${{ secrets.AZURE_CLIENT_ID }}" \
            --body "{
              \"resource-group\": \"${{ needs.provision-virtualbox-runner.outputs.resource-group }}\",
              \"runner-name\": \"${{ needs.provision-virtualbox-runner.outputs.runner-name }}\"
            }" || echo "Failed to delete resource group, continuing..."
