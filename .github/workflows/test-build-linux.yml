name: Test Packer Build on Linux for VMs

permissions:
  contents: read

on:
  workflow_dispatch:
    inputs:
      enable_linux_qemu:
        description: "Enable Linux QEMU builds"
        required: false
        default: true
        type: boolean
  schedule:
    # Nightly cold-cache bootstrap check only; all build jobs skip scheduled runs.
    - cron: "30 3 * * *"
  push:
    branches: [main]
    paths:
      - "cmd/main.go"
      - "cmd/cmd/**"
      - "build/packer/linux/*"
      - "build/packer/linux/**/*"
      - "build/packer/windows/*"
      - "build/packer/windows/**/*"
      - "pkg/build/**"
      - "pkg/deploy/**"
      - "test/e2e/**"
      - "pkg/oci/**"
      - "pkg/provision/**"
      - "scripts/linux/*"
      - "scripts/linux/**/*"
      - "scripts/macos/create-win11-autounattend-iso.sh"
      - "scripts/macos/playwright_win11_iso.py"
      - "scripts/macos/requirements.txt"
      - "scripts/macos/download-arm64-uefi.sh"
      - "scripts/macos/download-utm-guest-tools.sh"
      - "scripts/macos/download-virtio-win-iso.sh"
      - ".github/workflows/test-build-linux.yml"
      - ".github/actions/download-build-cache/**"
      - ".github/actions/upload-build-cache/**"
  pull_request:
    paths:
      - "cmd/main.go"
      - "cmd/cmd/**"
      - "build/packer/linux/*"
      - "build/packer/linux/**/*"
      - "build/packer/windows/*"
      - "build/packer/windows/**/*"
      - "pkg/build/**"
      - "pkg/deploy/**"
      - "test/e2e/**"
      - "pkg/oci/**"
      - "pkg/provision/**"
      - "scripts/linux/*"
      - "scripts/linux/**/*"
      - "scripts/macos/create-win11-autounattend-iso.sh"
      - "scripts/macos/playwright_win11_iso.py"
      - "scripts/macos/requirements.txt"
      - "scripts/macos/download-arm64-uefi.sh"
      - "scripts/macos/download-utm-guest-tools.sh"
      - "scripts/macos/download-virtio-win-iso.sh"
      - ".github/workflows/test-build-linux.yml"
      - ".github/actions/download-build-cache/**"
      - ".github/actions/upload-build-cache/**"

concurrency:
  # Keep scheduled runs out of the main branch group so they never cancel a push build.
  group: ${{ github.workflow }}-${{ github.event_name == 'schedule' && 'schedule' || github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

env:
  OCI_UBUNTU_IMAGE: ghcr.io/${{ github.repository_owner }}/ubuntu-24

jobs:
  # The cold-cache bootstrap exercises the Python/Playwright environment setup and the other
  # cold downloads, but never contacts Microsoft: resolving the Windows 11 ISO link is owned by
  # refresh-windows-iso.yml, where a refusal is a neutral result. Run it nightly and on PRs that
  # change the bootstrap code.
  detect-cold-cache-changes:
    if: github.event_name == 'pull_request'
    name: detect cold-cache relevant changes
    runs-on: ubuntu-24.04
    outputs:
      relevant: ${{ steps.diff.outputs.relevant }}
    steps:
      - name: Compare changed files
        id: diff
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          # Renovate bumps ISO versions/checksums in dependencies.go; that does not
          # touch the bootstrap logic, so bot PRs only count the always-relevant files.
          # Renovate authenticates with a personal token, so match its branch prefix too.
          PR_FROM_BOT: ${{ github.event.pull_request.user.type == 'Bot' || startsWith(github.head_ref, 'renovate/') }}
        run: |
          set -euo pipefail
          # playwright_win11_iso.py is covered by the PR trigger of refresh-windows-iso.yml.
          patterns=(
            "scripts/macos/requirements.txt"
            "pkg/build/dependencies_test.go"
          )
          if [ "$PR_FROM_BOT" != "true" ]; then
            patterns+=("pkg/build/dependencies.go")
          fi

          relevant=true
          if files="$(gh api "repos/${GITHUB_REPOSITORY}/compare/${BASE_SHA}...${HEAD_SHA}" --jq '.files[].filename')"; then
            # The compare API lists at most 300 files; treat larger diffs as relevant.
            if [ "$(printf '%s\n' "$files" | grep -c .)" -lt 300 ]; then
              relevant=false
              for pattern in "${patterns[@]}"; do
                if printf '%s\n' "$files" | grep -Fqx -- "$pattern"; then
                  relevant=true
                  echo "Cold-cache relevant change: $pattern"
                fi
              done
            fi
          else
            echo "Could not determine changed files; running cold-cache bootstrap."
          fi
          echo "relevant=$relevant" >> "$GITHUB_OUTPUT"

  test-cold-cache-dependency-bootstrap:
    needs: [detect-cold-cache-changes]
    if: >-
      !cancelled() &&
      (
        github.event_name == 'schedule' ||
        (github.event_name == 'workflow_dispatch' && inputs.enable_linux_qemu) ||
        needs.detect-cold-cache-changes.outputs.relevant == 'true'
      )
    name: cold-cache dependency bootstrap
    runs-on: ubuntu-24.04
    env:
      DEV_ALCHEMY_APP_DATA_DIR: ${{ github.workspace }}/.dev-alchemy
      DEV_ALCHEMY_CACHE_DIR: ${{ github.workspace }}/.dev-alchemy/cache
      DEV_ALCHEMY_VAGRANT_DIR: ${{ github.workspace }}/.dev-alchemy/.vagrant
      DEV_ALCHEMY_PACKER_CACHE_DIR: ${{ github.workspace }}/.dev-alchemy/packer_cache
      PACKER_CACHE_DIR: ${{ github.workspace }}/.dev-alchemy/packer_cache
      PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/.playwright-browsers
    timeout-minutes: 60
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Clear managed cache and Playwright bootstrap state
        run: |
          rm -rf "${DEV_ALCHEMY_APP_DATA_DIR}" "${PLAYWRIGHT_BROWSERS_PATH}" "${HOME}/.cache/ms-playwright" scripts/macos/.venv

      - name: Install dependencies linux
        run: |
          go run cmd/main.go install

      - name: Run cold-cache dependency bootstrap tests
        shell: bash
        env:
          RUN_INTEGRATION_TESTS: "1"
        run: |
          go test -timeout 45m -v ./pkg/build -run '^(TestIntegrationBootstrapWindows11DownloadEnv|TestResolveDebianPackageURL|TestResolveAndDownloadQemuEfiAarch64)$'

      - name: Upload Playwright diagnostics
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-diagnostics-cold-cache
          path: ${{ env.DEV_ALCHEMY_CACHE_DIR }}/windows/playwright-diagnostics
          if-no-files-found: ignore
          include-hidden-files: true
          retention-days: 7

  test-packer-build:
    if: github.event_name == 'push' || github.event_name == 'pull_request' || inputs.enable_linux_qemu
    name: build ${{ matrix.go_test_name }} runner_os ${{ matrix.runs_on }}
    runs-on: ${{ matrix.runs_on }}
    permissions:
      contents: read
      id-token: write
    env:
      # Build jobs resolve the Windows 11 ISO through the cache manifest and never contact Microsoft.
      SAILWRIGHT_WIN11_ISO_OFFLINE: "1"
      DEV_ALCHEMY_APP_DATA_DIR: ${{ github.workspace }}/.dev-alchemy
      DEV_ALCHEMY_CACHE_DIR: ${{ github.workspace }}/.dev-alchemy/cache
      DEV_ALCHEMY_VAGRANT_DIR: ${{ github.workspace }}/.dev-alchemy/.vagrant
      DEV_ALCHEMY_PACKER_CACHE_DIR: ${{ github.workspace }}/.dev-alchemy/packer_cache
      PACKER_CACHE_DIR: ${{ github.workspace }}/.dev-alchemy/packer_cache
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        include:
          - vm_os: ubuntu
            ubuntu_type: server
            arch: amd64
            go_test_name: TestBuildQemuUbuntuServerAmd64OnLinux
            dependency_test_name: TestIntegrationDependencyReconciliationQemuUbuntuAmd64OnLinux
            runs_on: ubuntu-24.04
            packer_start_only: "false"
            packer_start_timeout: "180"
            cache_files: >-
              [{"local-path":"./.dev-alchemy/cache/linux/ubuntu-24.04.5-live-server-amd64.iso"}]
          - vm_os: ubuntu
            ubuntu_type: desktop
            arch: amd64
            go_test_name: TestBuildQemuUbuntuDesktopAmd64OnLinux
            dependency_test_name: TestIntegrationDependencyReconciliationQemuUbuntuDesktopAmd64OnLinux
            runs_on: ubuntu-24.04
            packer_start_only: "false"
            packer_start_timeout: "180"
            cache_files: >-
              [{"local-path":"./.dev-alchemy/cache/linux/ubuntu-24.04.5-live-server-amd64.iso"}]
          - vm_os: windows11
            ubuntu_type: ""
            arch: amd64
            go_test_name: TestBuildQemuWindows11Amd64OnLinux
            dependency_test_name: TestIntegrationDependencyReconciliationQemuWindows11Amd64OnLinux
            runs_on: ubuntu-24.04
            packer_start_only: "true"
            packer_start_timeout: "180"
            cache_files: >-
              [{"local-path":"./.dev-alchemy/cache/windows11/iso/win11_english_amd64.iso","manifest":"windows11/iso/win11-amd64.json","blob-name":"win11_25h2_english_amd64.iso"},
               {"local-path":"./.dev-alchemy/cache/utm/utm-guest-tools-latest.iso"},
               {"local-path":"./.dev-alchemy/cache/windows/virtio-win.iso"}]
          - vm_os: ubuntu
            ubuntu_type: server
            arch: arm64
            go_test_name: TestBuildQemuUbuntuServerArm64OnLinux
            dependency_test_name: TestIntegrationDependencyReconciliationQemuUbuntuArm64OnLinux
            runs_on: ubuntu-24.04-arm
            packer_start_only: "false"
            packer_start_timeout: "180"
            cache_files: >-
              [{"local-path":"./.dev-alchemy/cache/linux/ubuntu-24.04.5-live-server-arm64.iso"},
               {"local-path":"./.dev-alchemy/cache/qemu-efi-aarch64_all.deb"}]
          - vm_os: ubuntu
            ubuntu_type: desktop
            arch: arm64
            go_test_name: TestBuildQemuUbuntuDesktopArm64OnLinux
            dependency_test_name: TestIntegrationDependencyReconciliationQemuUbuntuDesktopArm64OnLinux
            runs_on: ubuntu-24.04-arm
            packer_start_only: "false"
            packer_start_timeout: "180"
            cache_files: >-
              [{"local-path":"./.dev-alchemy/cache/linux/ubuntu-24.04.5-live-server-arm64.iso"},
               {"local-path":"./.dev-alchemy/cache/qemu-efi-aarch64_all.deb"}]
          - vm_os: windows11
            ubuntu_type: ""
            arch: arm64
            go_test_name: TestBuildQemuWindows11Arm64OnLinux
            dependency_test_name: TestIntegrationDependencyReconciliationQemuWindows11Arm64OnLinux
            runs_on: ubuntu-24.04-arm
            packer_start_only: "true"
            packer_start_timeout: "180"
            cache_files: >-
              [{"local-path":"./.dev-alchemy/cache/windows11/iso/win11_english_arm64.iso","manifest":"windows11/iso/win11-arm64.json","blob-name":"win11_25h2_english_arm64.iso"},
               {"local-path":"./.dev-alchemy/cache/utm/utm-guest-tools-latest.iso"},
               {"local-path":"./.dev-alchemy/cache/windows/virtio-win.iso"},
               {"local-path":"./.dev-alchemy/cache/qemu-efi-aarch64_all.deb"}]

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Download build cache files
        uses: ./.github/actions/download-build-cache
        with:
          storage-backend: ftp
          files: ${{ matrix.cache_files }}
          ftp-server: ${{ vars.BUILD_CACHE_FTP_SERVER }}
          ftp-port: ${{ vars.BUILD_CACHE_FTP_PORT }}
          ftp-username: ${{ secrets.BUILD_CACHE_FTP_USERNAME }}
          ftp-password: ${{ secrets.BUILD_CACHE_FTP_PASSWORD }}
          ftp-base-dir: /private
          local-cache-dir: ""

      - name: Install dependencies linux
        run: |
          go run cmd/main.go install

      - name: Run dependency reconciliation smoke test TEST_NAME=${{ matrix.dependency_test_name }}
        id: dependency_reconciliation
        shell: bash
        continue-on-error: true
        env:
          RUN_INTEGRATION_TESTS: "1"
        run: |
          go test -timeout 45m -v ./pkg/build -run "^${{ matrix.dependency_test_name }}$"

      - name: Run build for arch=${{ matrix.arch }} TEST_NAME=${{ matrix.go_test_name }} on runner OS=${{ matrix.runs_on }}
        id: packer_build
        shell: bash
        continue-on-error: true
        env:
          RUN_INTEGRATION_TESTS: "1"
          DEV_ALCHEMY_PACKER_START_ONLY: ${{ matrix.packer_start_only }}
          DEV_ALCHEMY_PACKER_START_TIMEOUT: ${{ matrix.packer_start_timeout }}
          PACKER_LOG: 1
          PACKER_LOG_PATH: ${{ github.workspace }}/artifact/${{ matrix.go_test_name }}.packer.log
          PACKER_GITHUB_API_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p artifact
          go mod vendor
          make test-build-specific TEST_NAME=${{ matrix.go_test_name }}

      - name: Run lifecycle E2E scenarios
        if: steps.packer_build.outcome == 'success'
        timeout-minutes: 240
        shell: bash
        env:
          SAILWRIGHT_E2E_TARGET: ${{ matrix.vm_os }}/${{ matrix.ubuntu_type }}/${{ matrix.arch }}
          SAILWRIGHT_E2E_OUT: ${{ runner.temp }}/e2e-lifecycle
          SAILWRIGHT_E2E_REUSE_IMAGE: "1"
          SAILWRIGHT_E2E_INCLUDE_UNSTABLE: "1"
          SAILWRIGHT_E2E_ALLOW_HOST_CHANGES: "1"
        run: |
          export SAILWRIGHT_E2E_BIN="$RUNNER_TEMP/sailwright-e2e"
          go build -o "$SAILWRIGHT_E2E_BIN" ./cmd/main.go
          go test -tags e2e ./test/e2e -run '^TestScenarios/(vm-lifecycle-linux|destroy-idempotent|local-check)$' -count=1 -timeout 4h -v

      - name: Upload lifecycle E2E reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-lifecycle-${{ matrix.go_test_name }}
          path: ${{ runner.temp }}/e2e-lifecycle
          if-no-files-found: ignore

      - name: Upload Ubuntu OCI build artifact
        if: steps.packer_build.outcome == 'success' && matrix.vm_os == 'ubuntu' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v7
        with:
          name: ubuntu-oci-${{ matrix.ubuntu_type }}-${{ matrix.arch }}
          path: .dev-alchemy/cache/ubuntu/qemu-ubuntu-${{ matrix.ubuntu_type }}-packer-${{ matrix.arch }}.qcow2
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 1

      - name: Move .vnc.mp4 files to artifact directory
        if: always()
        run: |
          mkdir -p artifact
          if [ -d ./.dev-alchemy/cache ]; then
            find ./.dev-alchemy/cache -name '*.vnc.mp4' -exec cp {} artifact/ \;
          fi

      - name: Upload packer log artifact (always)
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: packer-log-${{ matrix.go_test_name }}
          path: artifact/${{ matrix.go_test_name }}.packer.log
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload packer-qemu-${{ matrix.go_test_name }}.vnc.mp4 artifact (always)
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: packer-qemu-${{ matrix.go_test_name }}.vnc.mp4
          path: artifact/*.vnc.mp4
          if-no-files-found: ignore
          retention-days: 1

      - name: Upload build cache files
        uses: ./.github/actions/upload-build-cache
        with:
          storage-backend: ftp
          files: ${{ matrix.cache_files }}
          ftp-server: ${{ vars.BUILD_CACHE_FTP_SERVER }}
          ftp-port: ${{ vars.BUILD_CACHE_FTP_PORT }}
          ftp-username: ${{ secrets.BUILD_CACHE_FTP_USERNAME }}
          ftp-password: ${{ secrets.BUILD_CACHE_FTP_PASSWORD }}
          ftp-base-dir: /private
          local-cache-dir: ""

      - name: Fail if dependency reconciliation or build failed
        if: always() && (steps.dependency_reconciliation.outcome == 'failure' || steps.packer_build.outcome == 'failure')
        run: |
          echo "Dependency reconciliation and/or build smoke test failed. Failing workflow."
          exit 1

  publish-ubuntu-oci-artifacts:
    needs: [test-packer-build]
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    name: publish ubuntu ${{ matrix.ubuntu_type }} ${{ matrix.arch }} OCI artifact
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    env:
      DEV_ALCHEMY_APP_DATA_DIR: ${{ github.workspace }}/.dev-alchemy
      DEV_ALCHEMY_CACHE_DIR: ${{ github.workspace }}/.dev-alchemy/cache
      DEV_ALCHEMY_VAGRANT_DIR: ${{ github.workspace }}/.dev-alchemy/.vagrant
      DEV_ALCHEMY_PACKER_CACHE_DIR: ${{ github.workspace }}/.dev-alchemy/packer_cache
      PACKER_CACHE_DIR: ${{ github.workspace }}/.dev-alchemy/packer_cache
    strategy:
      fail-fast: false
      matrix:
        include:
          - ubuntu_type: server
            arch: amd64
          - ubuntu_type: desktop
            arch: amd64
          - ubuntu_type: server
            arch: arm64
          - ubuntu_type: desktop
            arch: arm64
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Download Ubuntu OCI build artifact
        uses: actions/download-artifact@v8
        with:
          name: ubuntu-oci-${{ matrix.ubuntu_type }}-${{ matrix.arch }}
          path: .dev-alchemy/cache/ubuntu

      - name: Push Ubuntu OCI artifact to GHCR
        shell: bash
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          reference="${OCI_UBUNTU_IMAGE}:${{ matrix.ubuntu_type }}-${{ matrix.arch }}-linux-build"
          echo "Pushing ${reference}"
          printf '%s' "${GHCR_TOKEN}" | go run cmd/main.go push "${reference}" \
            --os ubuntu \
            --type "${{ matrix.ubuntu_type }}" \
            --arch "${{ matrix.arch }}" \
            --host-os linux \
            --engine qemu \
            --username "${GITHUB_ACTOR}" \
            --password-stdin
