name: Test Build Cache Actions

permissions:
  contents: read

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/actions/download-build-cache/**"
      - ".github/actions/upload-build-cache/**"
      - ".github/workflows/test-cache-actions.yml"
  pull_request:
    paths:
      - ".github/actions/download-build-cache/**"
      - ".github/actions/upload-build-cache/**"
      - ".github/workflows/test-cache-actions.yml"

jobs:
  cache-actions:
    name: Validate build cache actions
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Install ShellCheck
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck

      - name: Check Bash scripts
        shell: bash
        run: |
          set -euo pipefail

          scripts=(
            ".github/actions/download-build-cache/scripts/download-build-cache.sh"
            ".github/actions/upload-build-cache/scripts/upload-build-cache.sh"
          )

          for script in "${scripts[@]}"; do
            bash -n "$script"
          done

          shellcheck "${scripts[@]}"

      - name: Check PowerShell scripts
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          $scripts = @(
              '.github/actions/download-build-cache/scripts/download-build-cache.ps1',
              '.github/actions/upload-build-cache/scripts/upload-build-cache.ps1'
          )

          foreach ($script in $scripts) {
              $tokens = $null
              $errors = $null
              [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $script), [ref] $tokens, [ref] $errors) | Out-Null
              if ($errors.Count -gt 0) {
                  $errors | Format-List | Out-String | Write-Error
                  throw "PowerShell parser errors found in $script."
              }
          }

          if (-not (Get-Module -ListAvailable -Name PSScriptAnalyzer)) {
              Install-Module -Name PSScriptAnalyzer -Scope CurrentUser -Force -SkipPublisherCheck
          }

          Import-Module PSScriptAnalyzer
          $issues = @(
              foreach ($script in $scripts) {
                  Invoke-ScriptAnalyzer `
                      -Path $script `
                      -Severity Warning,Error `
                      -ExcludeRule @('PSAvoidUsingWriteHost', 'PSUseApprovedVerbs')
              }
          )

          if ($issues.Count -gt 0) {
              $issues | Format-List | Out-String | Write-Error
              throw 'PowerShell analyzer issues found.'
          }

      - name: Test Bash local cache behavior
        shell: bash
        run: |
          set -euo pipefail

          download_script=".github/actions/download-build-cache/scripts/download-build-cache.sh"
          upload_script=".github/actions/upload-build-cache/scripts/upload-build-cache.sh"
          root="$(mktemp -d)"
          trap 'rm -rf "$root"' EXIT

          workspace="$root/workspace"
          local_cache="$root/local-cache"
          fake_bin="$root/fake-bin"
          mkdir -p "$workspace" "$local_cache" "$fake_bin"

          cat > "$fake_bin/curl" <<'EOF'
          #!/usr/bin/env bash
          set -euo pipefail
          printf '%s\n' "$*" >> "${FAKE_CURL_LOG:-/dev/null}"
          out=""
          url=""
          prev=""
          is_head=false
          for arg in "$@"; do
            if [ "$arg" = "--head" ]; then
              is_head=true
            fi
            if [ "$arg" = "--upload-file" ]; then
              exit "${FAKE_CURL_UPLOAD_EXIT:-0}"
            fi
            if [ "$prev" = "--output" ]; then
              out="$arg"
            fi
            prev="$arg"
            url="$arg"
          done
          # With FAKE_CURL_REMOTE set, serve files from that directory as the FTP base dir /cache.
          if [ -n "${FAKE_CURL_REMOTE:-}" ]; then
            rel="${url#ftp://localhost/cache/}"
            if [ "$is_head" = "true" ]; then
              if [ -f "$FAKE_CURL_REMOTE/$rel" ]; then exit 0; fi
              exit 78
            fi
            if [ -n "$out" ] && [ "$out" != "/dev/null" ]; then
              cp "$FAKE_CURL_REMOTE/$rel" "$out"
            fi
            exit 0
          fi
          if [ "$is_head" = "true" ]; then
            exit "${FAKE_CURL_HEAD_EXIT:-78}"
          fi
          exit 0
          EOF
          chmod +x "$fake_bin/curl"

          cat > "$fake_bin/readlink" <<'EOF'
          #!/usr/bin/env bash
          set -euo pipefail
          if [ "${1:-}" = "-f" ]; then
            echo "readlink: illegal option -- f" >&2
            exit 1
          fi
          exec /usr/bin/readlink "$@"
          EOF
          chmod +x "$fake_bin/readlink"

          export PATH="$fake_bin:$PATH"
          export CACHE_BACKEND=ftp
          export FTP_SERVER=localhost
          export FTP_USERNAME=user
          export FTP_PASSWORD=password
          export FTP_BASE_DIR=/cache
          export LOCAL_CACHE_DIR="$local_cache"
          export FAKE_CURL_LOG="$root/curl.log"

          run_download() {
            CACHE_FILES="$1" bash "$download_script"
          }

          run_upload() {
            CACHE_FILES="$1" bash "$upload_script"
          }

          run_download '[]'
          run_upload '[]'

          mkdir -p "$local_cache/hits"
          printf 'cached-hit' > "$local_cache/hits/file.iso"
          hit_target="$workspace/downloads/file.iso"
          run_download '[{"local-path":"'"$hit_target"'","blob-name":"hits/file.iso"}]'
          test -L "$hit_target"
          test "$(readlink "$hit_target")" = "$local_cache/hits/file.iso"
          test "$(cat "$hit_target")" = "cached-hit"
          run_upload '[{"local-path":"'"$hit_target"'","blob-name":"hits/file.iso"}]'
          grep -F -- "--upload-file" "$FAKE_CURL_LOG" >/dev/null
          grep -F -- "ftp://localhost/cache/hits/file.iso" "$FAKE_CURL_LOG" >/dev/null

          miss_target="$workspace/missing/file.iso"
          run_download '[{"local-path":"'"$miss_target"'","blob-name":"missing/file.iso"}]'
          test ! -e "$miss_target"

          nested_source="$workspace/source/nested.bin"
          mkdir -p "$(dirname "$nested_source")"
          printf 'nested-payload' > "$nested_source"
          run_upload '[{"local-path":"'"$nested_source"'","blob-name":"nested/path/nested.bin"}]'
          test "$(cat "$local_cache/nested/path/nested.bin")" = "nested-payload"

          overwrite_source="$workspace/source/overwrite.bin"
          mkdir -p "$local_cache/overwrite"
          printf 'old-payload' > "$local_cache/overwrite/item.bin"
          printf 'new-payload' > "$overwrite_source"
          run_upload '[{"local-path":"'"$overwrite_source"'","blob-name":"overwrite/item.bin","overwrite":true}]'
          test "$(cat "$local_cache/overwrite/item.bin")" = "new-payload"

          # Remote cache failures must warn instead of failing the job.
          flaky_source="$workspace/source/flaky.bin"
          printf 'flaky-payload' > "$flaky_source"
          FAKE_CURL_HEAD_EXIT=28 run_upload '[{"local-path":"'"$flaky_source"'","blob-name":"flaky/check.bin"}]' > "$root/flaky-check.out"
          grep -F "::warning title=Build cache upload skipped::Could not check FTP object /cache/flaky/check.bin" "$root/flaky-check.out" >/dev/null
          if grep -F -- "--upload-file" "$FAKE_CURL_LOG" | grep -F "flaky/check.bin" >/dev/null; then
            echo "Upload must be skipped when the FTP object check fails" >&2
            exit 1
          fi
          FAKE_CURL_UPLOAD_EXIT=25 run_upload '[{"local-path":"'"$flaky_source"'","blob-name":"flaky/upload.bin"}]' > "$root/flaky-upload.out"
          grep -F "::warning title=Build cache upload skipped::Failed to upload FTP object /cache/flaky/upload.bin" "$root/flaky-upload.out" >/dev/null

          # Manifest-resolved entries: pointer JSON -> versioned object, sha256 verified.
          remote="$root/remote"
          mkdir -p "$remote/windows11/iso"
          export FAKE_CURL_REMOTE="$remote"
          iso_payload="iso-bytes-v1"
          iso_sha="$(printf '%s' "$iso_payload" | sha256sum | cut -d' ' -f1)"
          printf '%s' "$iso_payload" > "$remote/windows11/iso/win11_test_20261023.iso"
          printf '{"schema":1,"object":"win11_test_20261023.iso","sha256":"%s"}' "$iso_sha" > "$remote/windows11/iso/win11-amd64.json"

          manifest_target="$workspace/manifest/win11_english_amd64.iso"
          manifest_entry='[{"local-path":"'"$manifest_target"'","manifest":"windows11/iso/win11-amd64.json"}]'
          run_download "$manifest_entry"
          test "$(cat "$manifest_target")" = "$iso_payload"
          grep -F '"object":"win11_test_20261023.iso"' "$manifest_target.json" >/dev/null
          test "$(cat "$local_cache/win11_test_20261023.iso")" = "$iso_payload"
          test ! -e "$manifest_target.part"

          # A second run finds the matching sidecar and does not download again.
          : > "$FAKE_CURL_LOG"
          run_download "$manifest_entry" | grep -F "matches the manifest" >/dev/null
          if grep -F "win11_test_20261023.iso" "$FAKE_CURL_LOG" | grep -F -- "--output" >/dev/null; then
            echo "Matching manifest entry must not be downloaded again" >&2
            exit 1
          fi

          # A new manifest object replaces the stale file.
          new_payload="iso-bytes-v2"
          new_sha="$(printf '%s' "$new_payload" | sha256sum | cut -d' ' -f1)"
          printf '%s' "$new_payload" > "$remote/windows11/iso/win11_test_20270114.iso"
          printf '{"schema":1,"object":"win11_test_20270114.iso","sha256":"%s"}' "$new_sha" > "$remote/windows11/iso/win11-amd64.json"
          run_download "$manifest_entry"
          test "$(cat "$manifest_target")" = "$new_payload"
          grep -F '"object":"win11_test_20270114.iso"' "$manifest_target.json" >/dev/null

          # sha256 mismatch deletes the download and fails.
          printf 'corrupted' > "$remote/windows11/iso/win11_test_bad.iso"
          printf '{"schema":1,"object":"win11_test_bad.iso","sha256":"%s"}' "$iso_sha" > "$remote/windows11/iso/win11-arm64.json"
          mismatch_target="$workspace/manifest/win11_english_arm64.iso"
          if run_download '[{"local-path":"'"$mismatch_target"'","manifest":"windows11/iso/win11-arm64.json"}]' > "$root/mismatch.out" 2>&1; then
            echo "sha256 mismatch must fail" >&2
            exit 1
          fi
          grep -F "sha256 mismatch" "$root/mismatch.out" >/dev/null
          test ! -e "$mismatch_target"
          test ! -e "$mismatch_target.part"

          # Missing manifest is a miss, not an error.
          absent_target="$workspace/manifest/absent.iso"
          run_download '[{"local-path":"'"$absent_target"'","manifest":"windows11/iso/absent.json"}]'
          test ! -e "$absent_target"

          # The local runner cache is keyed by the versioned object name.
          printf '{"schema":1,"object":"win11_cached_20270201.iso","sha256":"%s"}' "$iso_sha" > "$remote/windows11/iso/win11-cached.json"
          printf 'cached-iso' > "$local_cache/win11_cached_20270201.iso"
          cached_target="$workspace/manifest/cached.iso"
          run_download '[{"local-path":"'"$cached_target"'","manifest":"windows11/iso/win11-cached.json"}]'
          test -L "$cached_target"
          test "$(cat "$cached_target")" = "cached-iso"

          # The azure backend does not support manifests.
          if CACHE_BACKEND=azure run_download "$manifest_entry" > "$root/azure.out" 2>&1; then
            echo "Azure backend with manifest must fail" >&2
            exit 1
          fi
          grep -F "only supported with the ftp backend" "$root/azure.out" >/dev/null

          # Uploads skip manifest-managed entries.
          : > "$FAKE_CURL_LOG"
          run_upload "$manifest_entry" | grep -F "managed by refresh workflow" >/dev/null
          if grep -F -- "--upload-file" "$FAKE_CURL_LOG" >/dev/null; then
            echo "Manifest entries must not be uploaded" >&2
            exit 1
          fi

      - name: Test PowerShell local cache behavior
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          $downloadScript = (Resolve-Path '.github/actions/download-build-cache/scripts/download-build-cache.ps1').Path
          $uploadScript = (Resolve-Path '.github/actions/upload-build-cache/scripts/upload-build-cache.ps1').Path
          $root = Join-Path ([System.IO.Path]::GetTempPath()) "cache-action-tests-$([System.Guid]::NewGuid())"
          $workspace = Join-Path $root 'workspace'
          $localCache = Join-Path $root 'local-cache'
          $fakeBin = Join-Path $root 'fake-bin'

          function ConvertTo-CacheJson {
              param([Parameter(Mandatory = $true)][object[]] $Files)
              return ConvertTo-Json -InputObject $Files -Compress -Depth 5
          }

          function Invoke-CacheScript {
              param(
                  [Parameter(Mandatory = $true)][string] $Script,
                  [Parameter(Mandatory = $true)][string] $Files
              )

              $env:CACHE_FILES = $Files
              $env:CACHE_BACKEND = 'ftp'
              $env:FTP_SERVER = 'localhost'
              $env:FTP_USERNAME = 'user'
              $env:FTP_PASSWORD = 'password'
              $env:FTP_BASE_DIR = '/cache'
              $env:LOCAL_CACHE_DIR = $localCache
              $env:FAKE_CURL_LOG = Join-Path $root 'curl.log'

              & $Script
          }

          function Assert-FileContent {
              param(
                  [Parameter(Mandatory = $true)][string] $Path,
                  [Parameter(Mandatory = $true)][string] $Expected
              )

              if (-not (Test-Path $Path -PathType Leaf)) {
                  throw "Expected file to exist: $Path"
              }

              $actual = Get-Content -Path $Path -Raw
              if ($actual -ne $Expected) {
                  throw "Unexpected content in $Path. Expected '$Expected', got '$actual'."
              }
          }

          try {
              New-Item -ItemType Directory -Path $workspace, $localCache, $fakeBin -Force | Out-Null

              $fakeCurl = Join-Path $fakeBin 'curl'
              Set-Content -Path $fakeCurl -NoNewline -Value @'
          #!/usr/bin/env bash
          set -euo pipefail
          printf '%s\n' "$*" >> "${FAKE_CURL_LOG:-/dev/null}"
          out=""
          url=""
          prev=""
          is_head=false
          for arg in "$@"; do
            if [ "$arg" = "--head" ]; then
              is_head=true
            fi
            if [ "$arg" = "--upload-file" ]; then
              exit "${FAKE_CURL_UPLOAD_EXIT:-0}"
            fi
            if [ "$prev" = "--output" ]; then
              out="$arg"
            fi
            prev="$arg"
            url="$arg"
          done
          # With FAKE_CURL_REMOTE set, serve files from that directory as the FTP base dir /cache.
          if [ -n "${FAKE_CURL_REMOTE:-}" ]; then
            rel="${url#ftp://localhost/cache/}"
            if [ "$is_head" = "true" ]; then
              if [ -f "$FAKE_CURL_REMOTE/$rel" ]; then exit 0; fi
              exit 78
            fi
            if [ -n "$out" ] && [ "$out" != "/dev/null" ]; then
              cp "$FAKE_CURL_REMOTE/$rel" "$out"
            fi
            exit 0
          fi
          if [ "$is_head" = "true" ]; then
            exit "${FAKE_CURL_HEAD_EXIT:-78}"
          fi
          exit 0
          '@
              & chmod +x $fakeCurl
              $env:PATH = "$fakeBin$([System.IO.Path]::PathSeparator)$env:PATH"

              Invoke-CacheScript -Script $downloadScript -Files '[]'
              Invoke-CacheScript -Script $uploadScript -Files '[]'

              $hitCache = Join-Path $localCache 'hits/file.iso'
              New-Item -ItemType Directory -Path (Split-Path -Parent $hitCache) -Force | Out-Null
              Set-Content -Path $hitCache -Value 'cached-hit' -NoNewline
              $hitTarget = Join-Path $workspace 'downloads/file.iso'
              Invoke-CacheScript -Script $downloadScript -Files (ConvertTo-CacheJson @(@{'local-path' = $hitTarget; 'blob-name' = 'hits/file.iso'}))
              Assert-FileContent -Path $hitTarget -Expected 'cached-hit'

              $missTarget = Join-Path $workspace 'missing/file.iso'
              Invoke-CacheScript -Script $downloadScript -Files (ConvertTo-CacheJson @(@{'local-path' = $missTarget; 'blob-name' = 'missing/file.iso'}))
              if (Test-Path $missTarget) {
                  throw "Expected cache miss to leave target absent: $missTarget"
              }

              $nestedSource = Join-Path $workspace 'source/nested.bin'
              New-Item -ItemType Directory -Path (Split-Path -Parent $nestedSource) -Force | Out-Null
              Set-Content -Path $nestedSource -Value 'nested-payload' -NoNewline
              Invoke-CacheScript -Script $uploadScript -Files (ConvertTo-CacheJson @(@{'local-path' = $nestedSource; 'blob-name' = 'nested/path/nested.bin'}))
              Assert-FileContent -Path (Join-Path $localCache 'nested/path/nested.bin') -Expected 'nested-payload'

              $overwriteSource = Join-Path $workspace 'source/overwrite.bin'
              $overwriteCache = Join-Path $localCache 'overwrite/item.bin'
              New-Item -ItemType Directory -Path (Split-Path -Parent $overwriteCache) -Force | Out-Null
              Set-Content -Path $overwriteCache -Value 'old-payload' -NoNewline
              Set-Content -Path $overwriteSource -Value 'new-payload' -NoNewline
              Invoke-CacheScript -Script $uploadScript -Files (ConvertTo-CacheJson @(@{'local-path' = $overwriteSource; 'blob-name' = 'overwrite/item.bin'; 'overwrite' = $true}))
              Assert-FileContent -Path $overwriteCache -Expected 'new-payload'

              # Remote cache failures must warn instead of failing the job.
              $flakySource = Join-Path $workspace 'source/flaky.bin'
              Set-Content -Path $flakySource -Value 'flaky-payload' -NoNewline
              $env:FAKE_CURL_HEAD_EXIT = '28'
              $checkOutput = Invoke-CacheScript -Script $uploadScript -Files (ConvertTo-CacheJson @(@{'local-path' = $flakySource; 'blob-name' = 'flaky/check.bin'})) 6>&1 | Out-String
              Remove-Item Env:FAKE_CURL_HEAD_EXIT
              if ($checkOutput -notmatch [regex]::Escape('::warning title=Build cache upload skipped::Could not check FTP object /cache/flaky/check.bin')) {
                  throw "Expected a warning when the FTP object check fails. Output: $checkOutput"
              }
              if ($LASTEXITCODE -ne 0) {
                  throw "Expected LASTEXITCODE to be reset after a failed FTP object check, got $LASTEXITCODE."
              }
              $env:FAKE_CURL_UPLOAD_EXIT = '25'
              $uploadOutput = Invoke-CacheScript -Script $uploadScript -Files (ConvertTo-CacheJson @(@{'local-path' = $flakySource; 'blob-name' = 'flaky/upload.bin'})) 6>&1 | Out-String
              Remove-Item Env:FAKE_CURL_UPLOAD_EXIT
              if ($uploadOutput -notmatch [regex]::Escape('::warning title=Build cache upload skipped::Failed to upload FTP object /cache/flaky/upload.bin')) {
                  throw "Expected a warning when the FTP upload fails. Output: $uploadOutput"
              }
              if ($LASTEXITCODE -ne 0) {
                  throw "Expected LASTEXITCODE to be reset after a failed FTP upload, got $LASTEXITCODE."
              }

              # Manifest-resolved entries: pointer JSON -> versioned object, sha256 verified.
              $remote = Join-Path $root 'remote'
              New-Item -ItemType Directory -Path (Join-Path $remote 'windows11/iso') -Force | Out-Null
              $env:FAKE_CURL_REMOTE = $remote
              $isoPayload = 'iso-bytes-v1'
              $isoSha = (Get-FileHash -InputStream ([System.IO.MemoryStream]::new([System.Text.Encoding]::UTF8.GetBytes($isoPayload))) -Algorithm SHA256).Hash.ToLowerInvariant()
              Set-Content -Path (Join-Path $remote 'windows11/iso/win11_test_20261023.iso') -Value $isoPayload -NoNewline
              Set-Content -Path (Join-Path $remote 'windows11/iso/win11-amd64.json') -Value ('{{"schema":1,"object":"win11_test_20261023.iso","sha256":"{0}"}}' -f $isoSha) -NoNewline

              $manifestTarget = Join-Path $workspace 'manifest/win11_english_amd64.iso'
              $manifestEntry = ConvertTo-CacheJson @(@{'local-path' = $manifestTarget; 'manifest' = 'windows11/iso/win11-amd64.json'})
              Invoke-CacheScript -Script $downloadScript -Files $manifestEntry
              Assert-FileContent -Path $manifestTarget -Expected $isoPayload
              if ((Get-Content -Path "$manifestTarget.json" -Raw) -notmatch 'win11_test_20261023.iso') {
                  throw 'Expected the sidecar to name the resolved object.'
              }
              Assert-FileContent -Path (Join-Path $localCache 'win11_test_20261023.iso') -Expected $isoPayload
              if (Test-Path "$manifestTarget.part") { throw 'Expected no leftover .part file.' }

              # A second run finds the matching sidecar and skips.
              $again = Invoke-CacheScript -Script $downloadScript -Files $manifestEntry 6>&1 | Out-String
              if ($again -notmatch 'matches the manifest') {
                  throw "Expected a matching manifest entry to be skipped. Output: $again"
              }

              # A new manifest object replaces the stale file.
              $newPayload = 'iso-bytes-v2'
              $newSha = (Get-FileHash -InputStream ([System.IO.MemoryStream]::new([System.Text.Encoding]::UTF8.GetBytes($newPayload))) -Algorithm SHA256).Hash.ToLowerInvariant()
              Set-Content -Path (Join-Path $remote 'windows11/iso/win11_test_20270114.iso') -Value $newPayload -NoNewline
              Set-Content -Path (Join-Path $remote 'windows11/iso/win11-amd64.json') -Value ('{{"schema":1,"object":"win11_test_20270114.iso","sha256":"{0}"}}' -f $newSha) -NoNewline
              Invoke-CacheScript -Script $downloadScript -Files $manifestEntry
              Assert-FileContent -Path $manifestTarget -Expected $newPayload

              # sha256 mismatch deletes the download and fails.
              Set-Content -Path (Join-Path $remote 'windows11/iso/win11_test_bad.iso') -Value 'corrupted' -NoNewline
              Set-Content -Path (Join-Path $remote 'windows11/iso/win11-arm64.json') -Value ('{{"schema":1,"object":"win11_test_bad.iso","sha256":"{0}"}}' -f $isoSha) -NoNewline
              $mismatchTarget = Join-Path $workspace 'manifest/win11_english_arm64.iso'
              $mismatchFailed = $false
              try {
                  Invoke-CacheScript -Script $downloadScript -Files (ConvertTo-CacheJson @(@{'local-path' = $mismatchTarget; 'manifest' = 'windows11/iso/win11-arm64.json'})) 2>&1 | Out-Null
              } catch {
                  $mismatchFailed = $true
              }
              if (-not $mismatchFailed) { throw 'sha256 mismatch must fail.' }
              if ((Test-Path $mismatchTarget) -or (Test-Path "$mismatchTarget.part")) {
                  throw 'Expected the mismatching download to be deleted.'
              }

              # Missing manifest is a miss, not an error.
              $absentTarget = Join-Path $workspace 'manifest/absent.iso'
              Invoke-CacheScript -Script $downloadScript -Files (ConvertTo-CacheJson @(@{'local-path' = $absentTarget; 'manifest' = 'windows11/iso/absent.json'}))
              if (Test-Path $absentTarget) { throw 'Expected a missing manifest to leave the target absent.' }

              # The azure backend does not support manifests.
              $azureFailed = $false
              try {
                  $env:CACHE_BACKEND = 'azure'
                  $env:CACHE_FILES = $manifestEntry
                  & $downloadScript 2>&1 | Out-Null
              } catch {
                  $azureFailed = $true
              }
              if (-not $azureFailed) { throw 'Azure backend with manifest must fail.' }

              # Uploads skip manifest-managed entries.
              $skipOutput = Invoke-CacheScript -Script $uploadScript -Files $manifestEntry 6>&1 | Out-String
              if ($skipOutput -notmatch 'managed by refresh workflow') {
                  throw "Expected manifest entries to be skipped on upload. Output: $skipOutput"
              }
          } finally {
              Remove-Item -Path $root -Recurse -Force -ErrorAction SilentlyContinue
          }
