name: Test Go Unit Tests

on:
  push:
    branches:
      - main
    paths:
      - "cmd/main.go"
      - "cmd/cmd/**"
      - "cmd/sailwright-gateway/**"
      - "internal/gateway/**"
      - "test/e2e/**"
      - ".github/workflows/test-cmd-unit-tests.yml"
      # Static checks in pkg/build and test/workflowcheck read these files.
      - ".github/workflows/test-build-linux.yml"
      - ".github/workflows/test-build-macos.yml"
      - "build/packer/**"
      - "scripts/linux/**"
      - "scripts/macos/**"
      - "pkg/deploy/**"
      - "go.mod"
      - "go.sum"
      - "test/workflowcheck/**"
      - "pkg/build/**"
      - "pkg/oci/**"
      - "tools/**"
      - "roles_test_1/**"
      - "roles_test_2/**"
      - "runtimeassets.go"
  pull_request:
    paths:
      - "cmd/main.go"
      - "cmd/cmd/**"
      - "cmd/sailwright-gateway/**"
      - "internal/gateway/**"
      - "test/e2e/**"
      - ".github/workflows/test-cmd-unit-tests.yml"
      # Static checks in pkg/build and test/workflowcheck read these files.
      - ".github/workflows/test-build-linux.yml"
      - ".github/workflows/test-build-macos.yml"
      - "build/packer/**"
      - "scripts/linux/**"
      - "scripts/macos/**"
      - "pkg/deploy/**"
      - "go.mod"
      - "go.sum"
      - "test/workflowcheck/**"
      - "pkg/build/**"
      - "pkg/oci/**"
      - "tools/**"
      - "roles_test_1/**"
      - "roles_test_2/**"
      - "runtimeassets.go"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  test:
    name: Run cmd unit tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Run cmd tests
        run: go test ./cmd/cmd/...

      - name: Run build package tests
        run: go test ./pkg/build/...

      - name: Run OCI package tests
        run: go test ./pkg/oci/...

      - name: Run tools tests
        run: go test ./tools/...

      - name: Run gateway and E2E runner tests
        run: go test ${{ runner.os == 'Linux' && '-race' || '' }} ./internal/gateway/... ./cmd/sailwright-gateway/... ./test/e2e/...

      - name: Run E2E smoke scenario against the CLI
        shell: bash
        run: |
          bin="$RUNNER_TEMP/sailwright$(go env GOEXE)"
          go build -o "$bin" ./cmd/main.go
          SAILWRIGHT_E2E_BIN="$bin" SAILWRIGHT_E2E_OUT="$RUNNER_TEMP/e2e-out" \
            go test -tags e2e ./test/e2e -run 'TestScenarios/smoke' -count=1 -v

      - name: Upload E2E report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-smoke-${{ matrix.os }}
          path: ${{ runner.temp }}/e2e-out
          if-no-files-found: ignore

  workflow-checks:
    name: Run GitHub Actions workflow checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Run workflow checks
        run: go test ./test/workflowcheck/...

  oci-integration:
    name: Run OCI registry integration test
    runs-on: ubuntu-latest
    services:
      registry:
        image: registry:2
        ports:
          - 5000:5000

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Wait for registry
        run: |
          for i in {1..30}; do
            if curl -fsS http://localhost:5000/v2/ > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          echo "registry did not become ready" >&2
          exit 1

      - name: Run OCI registry integration test
        env:
          DEV_ALCHEMY_OCI_INTEGRATION_REF: localhost:5000/dev-alchemy/integration:${{ github.run_id }}
          DEV_ALCHEMY_OCI_INTEGRATION_PLAIN_HTTP: "true"
        run: go test -v ./pkg/oci -run TestOCIRegistryPushPullIntegration -count=1
