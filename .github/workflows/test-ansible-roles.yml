# GitHub Actions workflow to test all Ansible roles on Windows, macOS, and Ubuntu
name: Test Ansible Roles

on:
  push:
    branches: [main, feat*]
    paths:
      - "roles/**"
      - "roles_test_1/**"
      - "roles_test_2/**"
      - "playbooks/**"
      - "inventory/**"
      - "go.mod"
      - "go.sum"
      - "cmd/**"
      - "pkg/**"
      - "internal/**"
      - "test/localprovision/**"
      - "ansible.cfg"
      - "build/packer/**"
      - "deployments/vagrant/**"
      - "deployments/utm/**"
      - "scripts/linux/**"
      - "scripts/macos/**"
      - "scripts/windows/local-windows-provision-ssh-bootstrap.ps1"
      - "scripts/windows/local-windows-provision-ssh-cleanup.ps1"
      - "scripts/windows/local-windows-provision-winrm-bootstrap.ps1"
      - "scripts/windows/local-windows-provision-winrm-cleanup.ps1"
      - "runtimeassets.go"
      - ".github/workflows/test-ansible-roles.yml"
  pull_request:
    branches: [main, feat*]
    paths:
      - "roles/**"
      - "roles_test_1/**"
      - "roles_test_2/**"
      - "playbooks/**"
      - "inventory/**"
      - "go.mod"
      - "go.sum"
      - "cmd/**"
      - "pkg/**"
      - "internal/**"
      - "test/localprovision/**"
      - "ansible.cfg"
      - "build/packer/**"
      - "deployments/vagrant/**"
      - "deployments/utm/**"
      - "scripts/linux/**"
      - "scripts/macos/**"
      - "scripts/windows/local-windows-provision-ssh-bootstrap.ps1"
      - "scripts/windows/local-windows-provision-ssh-cleanup.ps1"
      - "scripts/windows/local-windows-provision-winrm-bootstrap.ps1"
      - "scripts/windows/local-windows-provision-winrm-cleanup.ps1"
      - "runtimeassets.go"
      - ".github/workflows/test-ansible-roles.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test-ansible-roles:
    name: Ansible on ${{ matrix.os }} with protocol ${{ matrix.ansible_protocol }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, macos-15-intel, ubuntu-24.04, ubuntu-24.04-arm, windows-2025]
        ansible_protocol: [ssh]
        include:
          - os: windows-2025
            ansible_protocol: winrm
    steps:
      - uses: fkirc/skip-duplicate-actions@v5
        with:
          cancel_others: true

      - name: Convert line endings to LF
        if: runner.os == 'Windows'
        run: |
          git config --global core.autocrlf false
          git config --global core.eol lf

      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
        if: runner.os != 'Windows'

      - name: Set up Go for local provisioning
        if: runner.os != 'Windows'
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Build the CLI once
        if: runner.os != 'Windows'
        shell: bash
        run: |
          CGO_ENABLED=0 go build -trimpath -o "$RUNNER_TEMP/sailwright" ./cmd/main.go
          echo "SAILWRIGHT_LOCAL_TEST_BIN=$RUNNER_TEMP/sailwright" >> "$GITHUB_ENV"

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
        if: runner.os == 'Windows'

      - name: Windows install cygwin
        uses: cygwin/cygwin-install-action@v7
        if: runner.os == 'Windows'
        with:
          packages: python39,python39-pip,python39-cryptography,openssh,git,make,gcc-core,gcc-g++,libffi-devel,sshpass

      - name: Windows detect cygwin bash
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          $candidates = @(
            'C:\tools\cygwin\bin\bash.exe',
            'C:\cygwin64\bin\bash.exe',
            'C:\cygwin\bin\bash.exe',
            'D:\cygwin\bin\bash.exe'
          )
          $cygwinBashPath = $candidates | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $cygwinBashPath) {
            throw "Unable to find cygwin bash.exe. Checked: $($candidates -join ', ')"
          }
          "CYGWIN_BASH_PATH=$cygwinBashPath" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Windows install Ansible
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          & $env:CYGWIN_BASH_PATH -l -c "python -m pip install ansible pywinrm"

      - name: Install Ansible
        run: |
          python -m pip install --upgrade pip
          python -m pip install ansible-core
          ansible-galaxy collection install community.general ansible.windows community.windows chocolatey.chocolatey
        if: runner.os != 'Windows'

      - name: Display Ansible version
        run: ansible --version
        if: runner.os != 'Windows'

      - name: Test local execution with real Ansible
        if: runner.os != 'Windows'
        shell: bash
        env:
          SAILWRIGHT_LOCAL_INTEGRATION: "1"
        run: |
          python -m unittest discover -s test/localprovision/scripts -v
          go test ./test/localprovision -count=1 -v -timeout 5m

      - name: Check, apply, and verify idempotency through the CLI
        shell: bash
        run: |
          set -euo pipefail
          log_dir="$RUNNER_TEMP/local-provision-logs"
          mkdir -p "$log_dir"
          export ANSIBLE_PYTHON_INTERPRETER
          ANSIBLE_PYTHON_INTERPRETER="$(python -c 'import sys; print(sys.executable)')"
          export DEV_ALCHEMY_APP_DATA_DIR="$RUNNER_TEMP/local-provision-data"
          export DEV_ALCHEMY_CONFIG_DIR="$RUNNER_TEMP/local-provision-config"
          for phase in check apply idempotency; do
            args=(provision local --playbook playbooks/setup.yml --yes --verbosity 0)
            if [[ "$phase" == check ]]; then args+=(--check); fi
            "$SAILWRIGHT_LOCAL_TEST_BIN" "${args[@]}" 2>&1 | tee "$log_dir/$phase.log"
            python test/localprovision/scripts/check_recap.py "$log_dir/$phase.log" "$phase"
          done
        env:
          ANSIBLE_FORCE_COLOR: "true"
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        if: runner.os != 'Windows'

      - name: Upload local provisioning logs
        if: always() && runner.os != 'Windows'
        uses: actions/upload-artifact@v6
        with:
          name: local-provision-${{ matrix.os }}
          path: ${{ runner.temp }}/local-provision-logs
          if-no-files-found: ignore

      - name: Run all Ansible roles on Windows via local provision wrapper (with retries)
        if: runner.os == 'Windows'
        shell: powershell
        env:
          ANSIBLE_FORCE_COLOR: "true"
        run: |
          $maxRetries = 6
          $success = $false
          $provisionArgs = @("run", "cmd/main.go", "provision", "local", "--proto", "${{ matrix.ansible_protocol }}", "--yes")

          for ($count = 1; $count -le $maxRetries -and -not $success; $count++) {
            & go @provisionArgs
            if ($LASTEXITCODE -eq 0) {
              $success = $true
            } else {
              Write-Host "Attempt $count failed with exit code $LASTEXITCODE."
              if ($count -lt $maxRetries) { Start-Sleep -Seconds 10 }
            }
          }
          if (-not $success) { throw "All $maxRetries attempts failed." }
