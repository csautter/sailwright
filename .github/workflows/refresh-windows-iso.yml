name: Refresh Windows 11 ISO

# The only workflow that talks to Microsoft's Windows 11 download page. It publishes versioned ISOs
# plus a manifest to the FTP cache; all build workflows resolve the ISO through that manifest.
# See docs/windows-iso-cache.md.

permissions:
  contents: read

on:
  schedule:
    # Mondays; the offline "due" rule decides whether Microsoft is contacted at all.
    - cron: "17 4 * * 1"
  workflow_dispatch:
    inputs:
      force:
        description: "Treat the refresh as due even if the due rule says to skip"
        required: false
        default: false
        type: boolean
      arch:
        description: "Architecture to refresh"
        required: false
        default: both
        type: choice
        options:
          - both
          - amd64
          - arm64
      # Temporary: remove together with the "adopt" mode after the migration
      # (docs/windows-iso-cache.md, "Migration from the flat cache", step 4).
      adopt_legacy:
        description: "One-time migration: publish the flat legacy win11_25h2_english_<arch>.iso as a versioned object"
        required: false
        default: false
        type: boolean
  pull_request:
    paths:
      - "scripts/macos/playwright_win11_iso.py"
      - "scripts/macos/win11_iso_hash.py"
      - "scripts/macos/requirements.txt"
      - "tools/win11iso/**"
      - "pkg/build/win11iso*.go"
      - "pkg/build/dependencies.go"
      - "pkg/build/testdata/win11_release_notes.html"
      - ".github/actions/refresh-windows-iso/**"
      - ".github/workflows/refresh-windows-iso.yml"
      - ".github/workflows/refresh-windows-iso-arch.yml"

concurrency:
  # Never cancel a running refresh: two refreshes must not race on the manifest.
  # Pull requests only resolve the link and get their own group so they cannot queue behind real runs.
  group: ${{ github.event_name == 'pull_request' && format('refresh-windows-iso-pr-{0}', github.event.pull_request.number) || 'refresh-windows-iso' }}
  cancel-in-progress: false

# PR runs only resolve the link (mode resolve-only): no download, no upload, and a refusal is
# just a warning. inputs.* are empty outside workflow_dispatch, so scheduled runs refresh both.
jobs:
  # One job per architecture, each on its own runner, so amd64 and arm64 never contact Microsoft
  # one after the other from the same runner.
  refresh-hosted-amd64:
    name: refresh amd64 on GitHub-hosted runner
    if: inputs.arch != 'arm64'
    uses: ./.github/workflows/refresh-windows-iso-arch.yml
    with:
      arch: amd64
      runs-on: ubuntu-24.04
      runner-kind: hosted
      mode: ${{ github.event_name == 'pull_request' && 'resolve-only' || (inputs.adopt_legacy && 'adopt' || 'refresh') }}
      force: ${{ inputs.force && 'true' || 'false' }}
    secrets:
      BUILD_CACHE_FTP_USERNAME: ${{ secrets.BUILD_CACHE_FTP_USERNAME }}
      BUILD_CACHE_FTP_PASSWORD: ${{ secrets.BUILD_CACHE_FTP_PASSWORD }}

  refresh-hosted-arm64:
    name: refresh arm64 on GitHub-hosted runner
    if: inputs.arch != 'amd64'
    uses: ./.github/workflows/refresh-windows-iso-arch.yml
    with:
      arch: arm64
      runs-on: ubuntu-24.04
      runner-kind: hosted
      mode: ${{ github.event_name == 'pull_request' && 'resolve-only' || (inputs.adopt_legacy && 'adopt' || 'refresh') }}
      force: ${{ inputs.force && 'true' || 'false' }}
    secrets:
      BUILD_CACHE_FTP_USERNAME: ${{ secrets.BUILD_CACHE_FTP_USERNAME }}
      BUILD_CACHE_FTP_PASSWORD: ${{ secrets.BUILD_CACHE_FTP_PASSWORD }}

  # Second attempt for an architecture Microsoft refused on the hosted runner: the self-hosted
  # Tart runner has a residential/office IP that Microsoft usually accepts.
  refresh-tart-amd64:
    name: refresh amd64 on self-hosted Tart runner
    needs: [refresh-hosted-amd64]
    if: >-
      github.event_name != 'pull_request' &&
      vars.USE_TART_MACOS_RUNNERS == 'true' &&
      needs.refresh-hosted-amd64.outputs.outcome == 'refused'
    uses: ./.github/workflows/refresh-windows-iso-arch.yml
    with:
      arch: amd64
      runs-on: macos-26-tart
      runner-kind: tart
      mode: refresh
      force: ${{ inputs.force && 'true' || 'false' }}
    secrets:
      BUILD_CACHE_FTP_USERNAME: ${{ secrets.BUILD_CACHE_FTP_USERNAME }}
      BUILD_CACHE_FTP_PASSWORD: ${{ secrets.BUILD_CACHE_FTP_PASSWORD }}

  refresh-tart-arm64:
    name: refresh arm64 on self-hosted Tart runner
    needs: [refresh-hosted-arm64]
    if: >-
      github.event_name != 'pull_request' &&
      vars.USE_TART_MACOS_RUNNERS == 'true' &&
      needs.refresh-hosted-arm64.outputs.outcome == 'refused'
    uses: ./.github/workflows/refresh-windows-iso-arch.yml
    with:
      arch: arm64
      runs-on: macos-26-tart
      runner-kind: tart
      mode: refresh
      force: ${{ inputs.force && 'true' || 'false' }}
    secrets:
      BUILD_CACHE_FTP_USERNAME: ${{ secrets.BUILD_CACHE_FTP_USERNAME }}
      BUILD_CACHE_FTP_PASSWORD: ${{ secrets.BUILD_CACHE_FTP_PASSWORD }}

  # A single refusal is harmless. A manifest that nobody could refresh for 90 days is not:
  # fail loudly so a human publishes an ISO manually (docs/windows-iso-cache.md).
  staleness-guard:
    name: staleness guard
    needs: [refresh-hosted-amd64, refresh-hosted-arm64, refresh-tart-amd64, refresh-tart-arm64]
    if: >-
      always() && github.event_name != 'pull_request' &&
      (needs.refresh-hosted-amd64.result == 'success' || needs.refresh-hosted-arm64.result == 'success')
    runs-on: ubuntu-24.04
    steps:
      - name: Fail when both runners are blocked and the manifest is stale
        shell: bash
        env:
          HOSTED_AMD64: ${{ needs.refresh-hosted-amd64.outputs.outcome }}
          HOSTED_ARM64: ${{ needs.refresh-hosted-arm64.outputs.outcome }}
          TART_AMD64: ${{ needs.refresh-tart-amd64.outputs.outcome }}
          TART_ARM64: ${{ needs.refresh-tart-arm64.outputs.outcome }}
          AGE_AMD64: ${{ needs.refresh-hosted-amd64.outputs.age_days }}
          AGE_ARM64: ${{ needs.refresh-hosted-arm64.outputs.age_days }}
          # Staleness limit (docs/adr/0006-versioned-windows-iso-cache.md); the Go due rule only
          # knows the 28-day re-check age.
          MAX_AGE_DAYS: "90"
        run: |
          set -euo pipefail
          stale=false
          for arch in amd64 arm64; do
            if [ "$arch" = "amd64" ]; then
              hosted="$HOSTED_AMD64"; tart="$TART_AMD64"; age="$AGE_AMD64"
            else
              hosted="$HOSTED_ARM64"; tart="$TART_ARM64"; age="$AGE_ARM64"
            fi
            if [ "$hosted" != "refused" ]; then
              continue
            fi
            # The Tart job only runs for refused architectures; any other outcome there means it succeeded.
            if [ -n "$tart" ] && [ "$tart" != "refused" ]; then
              continue
            fi
            age="${age:-9999}"
            if [ "$age" -ge "$MAX_AGE_DAYS" ]; then
              echo "::error title=Windows 11 ISO is stale ($arch)::Microsoft refused all runners and the manifest was last checked ${age} days ago. Publish an ISO manually (docs/windows-iso-cache.md)."
              stale=true
            else
              echo "::warning title=Windows 11 ISO refresh blocked ($arch)::Microsoft refused all runners; the manifest was last checked ${age} days ago (limit ${MAX_AGE_DAYS})."
            fi
          done
          if [ "$stale" = "true" ]; then
            exit 1
          fi
