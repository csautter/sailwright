version: 2
updates:
  - package-ecosystem: gomod
    directory: "/"
    schedule:
      interval: weekly

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly

  - package-ecosystem: docker
    directory: "/.devcontainer"
    schedule:
      interval: weekly

  - package-ecosystem: devcontainers
    directory: "/.devcontainer"
    schedule:
      interval: weekly

  - package-ecosystem: docker
    directory: "/build/docker/ansible"
    schedule:
      interval: weekly
    ignore:
      # Stay on Ubuntu LTS releases only (26.04 -> 28.04); skip interim releases.
      # Raise the lower bound when moving to the next LTS.
      - dependency-name: "ubuntu"
        versions: [">26.04, <28.04"]

  - package-ecosystem: docker
    directory: "/build/docker/ansible-windows-ssh"
    schedule:
      interval: weekly

  - package-ecosystem: docker
    directory: "/build/docker/ansible-windows-winrm"
    schedule:
      interval: weekly

  - package-ecosystem: docker-compose
    directory: "/deployments/docker-compose/ansible"
    schedule:
      interval: weekly

  - package-ecosystem: docker-compose
    directory: "/deployments/docker-compose/ansible-windows"
    schedule:
      interval: weekly

  - package-ecosystem: terraform
    directory: "/deployments/terraform/modules/azure_gh_runner"
    schedule:
      interval: weekly

  - package-ecosystem: terraform
    directory: "/deployments/terraform/modules/azure_state_backend"
    schedule:
      interval: weekly

  - package-ecosystem: pip
    directory: "/scripts/macos"
    schedule:
      interval: weekly

  - package-ecosystem: pip
    directory: "/scripts/gh-runner-func"
    schedule:
      interval: weekly
